# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# SYNC BAKEOFF — throwaway sync config. Not production.
# Field ownership is predeclared in docs/BAKEOFF-PREDECLARATION.md §2.
config:
  edition: 3

streams:
  # Single stream, multiple queries -> one bucket per user (avoids the
  # 1,000-bucket-per-user limit and keeps Q1 checkpoint reasoning simple:
  # one bucket means one checkpoint to observe).
  bakeoff:
    with:
      # COMPANY-WIDE VISIBILITY (376_company_membership; hadar 2026-07-25). A device
      # downloads the projects of every company it is an ACTIVE member of — not just
      # the ones it owns. Two steps: the caller's companies, then those companies'
      # active projects. The membership/role authority is the server; a client that
      # lies about auth.user_id() cannot (it is signed into the JWT).
      my_companies: |
        SELECT company_id FROM company_member
        WHERE user_id = auth.user_id() AND status = 'active'
      active_projects: |
        SELECT id FROM project
        WHERE company_id IN my_companies AND status = 'active'
    auto_subscribe: true
    queries:
      # Membership + company rows so the roster and "my company" resolve on-device.
      - SELECT * FROM company           WHERE id         IN my_companies
      - SELECT * FROM company_member     WHERE company_id IN my_companies
      - SELECT * FROM project           WHERE id         IN active_projects
      - SELECT * FROM capture           WHERE project_id IN active_projects
      - SELECT * FROM capture_op_state  WHERE project_id IN active_projects
      - SELECT * FROM attachment        WHERE project_id IN active_projects
