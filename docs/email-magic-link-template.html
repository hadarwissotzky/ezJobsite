<!--
  EZChangeOrders — Magic Link email template.

  WHERE THIS GOES: Supabase Dashboard → Authentication → Emails → "Magic Link".
  Paste the body below into that template. It cannot be set from the CLI, which is
  why it lives here as a file rather than being applied automatically.

  ALSO SET, on the same screen or under Auth → Settings:
    • Subject: "Log in to EZChangeOrders"
    • Email OTP expiry: 900 seconds (15 minutes) — the copy below SAYS 15 minutes,
      and a promise in an email that the server does not keep is the kind of small
      lie that teaches people to distrust the whole flow. Supabase defaults to
      3600s; change one and you must change the other.

  WHY THE PLAIN URL IS INCLUDED under the button: some mail clients strip or
  rewrite buttons, and a contractor whose button does nothing has no way forward.
  The pasteable link is the fallback that keeps them from being stuck.

  {{ .ConfirmationURL }} is Supabase's placeholder — it carries the token and
  redirects to `ezjobsite://auth-callback`, which App.tsx's deep-link handler
  catches. Do not rewrite or shorten it; the token is in the query string.
-->
<div style="margin:0;padding:0;background:#F7F4EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;padding:32px 20px;">

    <h1 style="margin:0 0 24px;text-align:center;font-size:26px;font-weight:800;color:#4E6243;">
      EZChangeOrders
    </h1>

    <div style="background:#ffffff;border:1px solid #E4DFD6;border-radius:14px;padding:28px 24px;text-align:center;">
      <p style="margin:0 0 22px;font-size:17px;line-height:26px;color:#151A1E;font-weight:600;">
        Tap the button below to log in. This link expires in 15 minutes.
      </p>

      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#1F3128;color:#ffffff;text-decoration:none;
                font-size:17px;font-weight:700;padding:15px 44px;border-radius:999px;">
        Log in
      </a>
    </div>

    <div style="border-top:1px solid #E4DFD6;margin-top:24px;padding-top:20px;text-align:center;">
      <p style="margin:0 0 8px;font-size:14px;line-height:20px;color:#5E666E;">
        Or paste this link into your browser:
      </p>
      <a href="{{ .ConfirmationURL }}"
         style="font-size:13px;line-height:19px;color:#4E6243;word-break:break-all;">
        {{ .ConfirmationURL }}
      </a>
    </div>

    <p style="margin:22px 0 0;text-align:center;font-size:13px;line-height:19px;color:#8a9199;">
      If you didn’t ask to log in, you can ignore this email — nothing will happen.
    </p>

  </div>
</div>
