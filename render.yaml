# Render blueprint — the processing pipeline, hosted.
#
# WHY THIS FILE EXISTS (hadar, 2026-08-06). The worker had never been deployed. It was
# `npm start` on a laptop, started 23 July, and it went on claiming jobs for two weeks
# with two-week-old code in memory — so every capture processed that day came back
# looking like a raw transcription while the current code sat on disk, correct and
# unreachable. Nothing about that failure was visible from the app: the queue drained,
# the jobs said `done`, and the output was quietly wrong.
#
# WHY A BACKGROUND WORKER AND NOT A WEB SERVICE. `src/run.ts` is a claim-one-job loop
# that sleeps when the queue is empty; it opens no port and answers no request. Render's
# `worker` type is exactly that shape. A web service would need a health endpoint it has
# no reason to have, and — on the free tier — would be put to sleep, which is the bug
# above with better branding.
#
# ADR-3 (`docs/ARCHITECTURE.md`) named Trigger.dev/Inngest for this. This is not that
# decision reversed: it is the same durable-jobs runtime, hosted the cheapest way that
# ends the laptop problem tonight. The durability it relies on — leases, retries,
# `for update skip locked` — is already in Postgres via `claim_job`, so the platform is
# providing uptime and nothing else. Moving to Trigger.dev later changes this file and
# no application code.
services:
  - type: worker
    name: ezjobsite-pipeline
    runtime: node
    # NOT free. A free instance sleeps, and a sleeping worker means transcripts and
    # write-ups silently never arrive — indistinguishable, from inside the app, from
    # the pipeline being broken.
    plan: starter
    # Same coast as the database (the Supabase pooler resolves to aws-0-us-west-1).
    # Every step here is chatty with Postgres; a cross-country round trip per read is
    # paid on every job, forever.
    region: oregon
    rootDir: apps/worker
    buildCommand: npm install
    startCommand: npm start
    # ONE. The lease is 120s and the structure step can approach it under a slow model
    # response; two instances are SAFE (claim_job uses `for update skip locked`) but
    # concurrency is a thing to turn on after measuring, not before.
    numInstances: 1
    # Deploy on push, deliberately. The failure this file exists to prevent was code
    # that ran for two weeks after it stopped matching the repo.
    autoDeploy: true
    branch: main
    envVars:
      # `--experimental-strip-types` (the start script runs TypeScript directly) needs
      # 22.6+. Without this pin Render picks its own default and the process dies at
      # startup on an unsupported flag.
      - key: NODE_VERSION
        value: 22.11.0
      # `sync: false` = set these in the dashboard, never in the repo. Two of them are
      # the keys that can read every customer's evidence and spend money.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # SPENDS CREDITS. A v2 secret key, scoped to Customers + Purchases read_write and
      # nothing else — it runs on every signature, so its blast radius is exactly its
      # permission list. Without it the spend outbox drains to a recorded failure with a
      # readable reason rather than retrying forever against nothing.
      - key: REVENUECAT_SECRET_KEY
        sync: false
      # Not a secret; pinned so a second project cannot be spent against by accident.
      - key: REVENUECAT_PROJECT_ID
        value: proj960cec8c

  # ── the client's approval page ──────────────────────────────────────────────
  #
  # WHY THIS IS HERE (hadar, 2026-08-10: "can we use render? we have a site").
  # The page had no working address. It deploys to GitHub Pages via
  # .github/workflows/deploy-confirm-page.yml, and that deploy is HIJACKED: the
  # account-level custom domain sends hadarwissotzky.github.io/* to capimpact.com
  # with a 301, and the repo-level CNAME meant to override it points at
  # approve.ezchangeorders.com, which has never had a DNS record. Both paths are
  # dead, so every approval link the app has ever minted goes nowhere.
  #
  # A Render static site fixes that today and needs no DNS: it publishes to a
  # *.onrender.com hostname immediately. A custom domain can be pointed at it later
  # without changing anything here.
  #
  # THE BUILD IS A SUBSTITUTION, not a bundler. confirm.html ships with
  # __SUPABASE_URL__ / __ANON_KEY__ placeholders precisely so a repo cannot hardcode
  # one project's keys — the same reason scripts/deploy-web.sh substitutes at upload.
  # The anon key is public by design (RLS and the RPC grants are the protection), but
  # it is still injected from the environment so a fork deploys against its own
  # backend rather than silently against this one.
  - type: web
    name: ezjobsite-approve
    runtime: static
    rootDir: apps/web
    buildCommand: |
      mkdir -p _site
      sed -e "s|__SUPABASE_URL__|${SUPABASE_URL}|g" \
          -e "s|__ANON_KEY__|${ANON_KEY}|g" confirm.html > _site/confirm.html
      # ewa.js holds no keys and reaches no network — copied, not substituted. It must
      # ship WITH confirm.html: the page loads it with a plain <script src> and fails
      # closed without it, which is correct and is exactly the DEF-6 defect that hit
      # the bucket deploy.
      cp ewa.js _site/ewa.js
      # The bare host serves the approval page. A link that loses its path should not
      # land on a 404 in front of a homeowner.
      cp _site/confirm.html _site/index.html
    staticPublishPath: _site
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: ANON_KEY
        sync: false
    headers:
      # The page reads a token from the query string. Referrer leakage would hand that
      # token to any host an outbound link points at — and the token IS the credential.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
