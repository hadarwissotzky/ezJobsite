/**
 * The document's identity line — "CHANGE ORDER #4 · Issued Aug 9 · Requested by …".
 *
 * These are the three facts a paper change order carries in its header, and every
 * one of them was already on the row and simply never returned to this page (399).
 *
 * `requested_by` arrives NULL when nobody was named: the server strips the seeded
 * role word rather than letting "Requested by: Owner" print on a document somebody
 * is about to sign. An absent fact is omitted here, never rendered as "Not set" —
 * a homeowner reading a blank field learns nothing except that the app has one.
 */
function identityHtml(h) {
  if (!h) return '';
  const bits = [];
  if (h.issued_at) bits.push(`Issued ${esc(new Date(h.issued_at).toLocaleDateString(undefined,
    { month: 'short', day: 'numeric', year: 'numeric' }))}`);
  if (h.requested_by) bits.push(`Requested by ${esc(h.requested_by)}`);
  if (h.co_number == null && !bits.length) return '';
  return `<div class="ident">
    ${h.co_number != null ? `<span class="idn">Change order #${esc(String(h.co_number))}</span>` : ''}
    ${bits.map((b) => `<span class="idm">${b}</span>`).join('')}
  </div>`;
}

/**
 * The contract summary.
 *
 * WHAT IS MISSING AND WHY IT IS NOT INVENTED. The design opens this table with
 * "Original contract amount — $74,000.00" and closes with a new contract total
 * derived from it. This product does not hold a base contract value; nothing in the
 * schema has one. So those two rows are OMITTED, and the note under the table says
 * the figures cover change orders only.
 *
 * The alternative — summing change orders and calling the result a contract total —
 * would print a number that is wrong by the entire value of the original contract,
 * on the page where somebody signs. Mandate #6 is about exactly this: the app
 * authors no figure it cannot prove.
 */
function summaryHtml(d) {
  const pr = d.__project;
  const prior = pr ? pr.approved_total_cents : d.approved_running_cents;
  if (prior == null && d.amount_cents == null) return '';
  const rows = [];
  if (prior != null) {
    rows.push(`<tr><td>Change orders you have already approved</td><td>${esc(usd(prior))}</td></tr>`);
  }
  if (d.amount_cents != null) {
    rows.push(`<tr class="this"><td>This change order</td><td>+ ${esc(usd(d.amount_cents))}</td></tr>`);
  }
  if (prior != null && d.amount_cents != null) {
    rows.push(`<tr class="tot"><td>Total in change orders if you approve</td><td>${esc(usd(prior + d.amount_cents))}</td></tr>`);
  }
  return `<div class="card">
    <div class="kicker" style="color:var(--steel)">Summary</div>
    <table class="csum">${rows.join('')}</table>
    <p class="csumnote">These figures cover change orders on this job only. They do
      not include your original contract amount.</p>
  </div>`;
}

/**
 * Photos sent WITH a message (398).
 *
 * Same failure handling as `photoStrip` — swap to the untransformed object exactly
 * once on error, and link each tile to the full-size original so a client can zoom
 * into what they are being shown. Deliberately NOT the same element: `photoStrip`
 * draws its own `card`, and a card nested inside a message clause would break the
 * bubble it belongs to. These sit inside the message, which is the whole point of
 * attaching them to it rather than to the document.
 *
 * TOLERATES A SERVER THAT HAS NOT BEEN MIGRATED. Before 398, `confirmation_thread`
 * returns rows with no `media` key at all — so this must read an absent field as "no
 * pictures", not as an error. An old server and a message with no photos are the
 * same thing to a reader, and the page renders identically for both.
 */
function messageShots(media) {
  if (!media || !media.length) return '';
  const tiles = media.map((p) => {
    const full = esc(p.fallback_url || p.url);
    return `<a href="${full}" target="_blank" rel="noopener"
              style="display:inline-block;margin:6px 6px 0 0">
        <img src="${esc(p.url)}" data-full="${full}" alt="Photo from the contractor"
             loading="lazy" decoding="async"
             style="max-width:170px;max-height:170px;border-radius:10px;
                    border:1px solid #e4e0d6;display:block"
             onerror="this.onerror=null;this.src=this.dataset.full">
      </a>`;
  }).join('');
  return `<div style="margin-top:6px">${tiles}</div>`;
}

/**
 * ── UNSEEN, ON A PAGE WITH NO ACCOUNT ────────────────────────────────────────────
 *
 * hadar, 2026-08-24: "when the page open notification need to indicate if there are
 * new messages that are unseen".
 *
 * There is no login here, so there is no server-side read receipt to hang this on and
 * there deliberately never will be one: the client is anonymous by design, and a
 * per-recipient read state would be the first thing on this page that identifies a
 * person who was promised they did not need an account. The watermark therefore lives
 * on the DEVICE, keyed by the token, and holds one number -- the timestamp of the
 * newest message this browser has actually had on screen.
 *
 * What that buys, and what it does not:
 *   * On the phone the SMS landed on -- the overwhelmingly common case -- it is
 *     exactly right, and it is the only mechanism that can tell a homeowner with no
 *     app and no notification that somebody answered them.
 *   * A DIFFERENT device (or a cleared browser) has no watermark, so every message
 *     the contractor has written reads as new. That is the honest answer for a reader
 *     who has genuinely never seen them here, and it is why the watermark starts at 0
 *     rather than at "now".
 *   * Private browsing can refuse storage entirely. Every access is wrapped: the page
 *     then simply never marks anything new, which is the old behaviour and not a
 *     failure.
 *
 * NOTHING HERE IS EVIDENCE. This is a reading aid on one device. It is not a record
 * of delivery, it is never sent to the server, and no part of the project record
 * depends on it.
 */
const SEEN_KEY = `ezjb:seen:${token || ''}`;

function seenMark() {
  try { return Number(localStorage.getItem(SEEN_KEY)) || 0; } catch { return 0; }
}

function msgTime(m) {
  const t = Date.parse((m && m.at) || '');
  return Number.isFinite(t) ? t : 0;
}

/**
 * Advance the watermark to the newest message currently on the page.
 *
 * Called only once the thread has actually been ON SCREEN (see `watchThreadSeen`).
 * Marking on render would mean a client who opened the link, read the price and
 * closed it without ever scrolling down had "seen" a reply they never laid eyes on --
 * and would then never be told about it again.
 */
function markThreadSeen(d) {
  let newest = 0;
  for (const m of (d.__thread || [])) newest = Math.max(newest, msgTime(m));
  if (newest > seenMark()) {
    try { localStorage.setItem(SEEN_KEY, String(newest)); } catch { /* storage refused */ }
  }
}

/**
 * The messages this VISIT should mark as new.
 *
 * Measured against `d.__seenAt` -- the watermark as it stood when the page loaded --
 * and not against the live watermark, so a reply stays visibly marked for the whole
 * visit instead of un-marking itself under the reader's eyes the moment the observer
 * fires. The stored watermark still moves; it decides the NEXT visit.
 */
function unseenMsgs(d) {
  const since = d.__seenAt || 0;
  return (d.__thread || []).filter((m) => m.side !== 'client' && msgTime(m) > since);
}

/**
 * The conversation, rendered on the client's own page -- and now WRITTEN from it.
 *
 * Shown ABOVE the actions, not below: a reply that answers their question is the
 * thing most likely to change the answer they give, and putting it under the
 * Approve button means they decide before they read it.
 *
 * ALWAYS RENDERS THE CARD, even when the thread is empty. `#thread` is the seam the
 * poller replaces in place when a reply lands, and with no element on the page there
 * was nothing to replace: the first reply to a client who had not yet asked anything
 * could never appear.
 *
 * ── THE COMPOSER LIVES HERE NOW ─────────────────────────────────────────────────
 * It used to live on its own screen (`askQuestion` called `screen()`, which replaces
 * the document). Three things were wrong with that and all three are the same thing:
 * the person typing could not see what they were typing about. Not the price, not the
 * contractor's last message, not their own earlier question. The card carries the box
 * because the box belongs next to the conversation it joins.
 *
 * WHAT IT STILL REFUSES TO DO. An answered document draws no composer: REQ-LC23
 * closes the thread on the answer and the server has enforced it since 308, so a box
 * here would be a control that cannot work. That is the silent-delivery-failure shape
 * this repo already found once on the contractor's side (DEF-4); it is not repeated.
 *
 * `opts.highlight` marks a card redrawn by the poller, so a reply that lands above the
 * fold while the client is reading the price is not silently absorbed into the page.
 */
function threadHtml(d, opts) {
  const o = opts || {};
  const t = d.__thread || [];
  const closed = d.status === 'already_answered';
  const company = d.company_name || 'The contractor';
  const since = d.__seenAt || 0;
  const waitingOnThem = t.length && t[t.length - 1].side === 'client';

  const msgs = t.map((m) => {
    const mine = m.side === 'client';
    const fresh = !mine && msgTime(m) > since;
    const when = m.at
      ? new Date(m.at).toLocaleString(undefined,
          { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';
    // The body is flush against its tag on purpose: `.msgb` is `white-space: pre-wrap`,
    // so a newline here would print as a blank first line in every bubble. Photos hang
    // below the bubble rather than inside it for the same reason.
    return `<div class="msg ${mine ? 'me' : 'them'}">
      <div class="msgb">${esc(m.__display ?? m.body)}</div>${
        m.__display && m.__display !== m.body
          ? `<div class="msgtr">${PL.translatedNote}</div>` : ''}
      ${mine ? '' : messageShots(m.media)}
      <div class="msgm">${mine ? 'You' : esc(company)}${when ? ` · ${esc(when)}` : ''}${
        fresh ? '<span class="msgnew">New</span>' : ''}</div>
    </div>`;
  }).join('');

  // WHAT HAPPENS NEXT, in the reader's terms, not the system's.
  //
  // The rule underneath this sentence is mandate #2 and R5b's standing prohibition:
  // "price changes resolve only through revision + fresh approval — never through
  // thread agreement". A contractor typing "ok, $1,500" in this thread has changed
  // nothing, and neither has a client typing "I'll pay $1,500". If the page does not
  // say so, a homeowner who negotiates a number in the discussion reasonably believes
  // they have agreed a price, and the next thing they see is a bill for the old one.
  const nextStep = closed
    ? (t.length
        ? `This is the discussion as it stood when you answered. It is kept with the
           record and does not change.`
        : '')
    : !t.length
    ? `Nothing here yet. If something is unclear — the price, what is included, the
       timing — write to ${esc(firstWord(company))} below. Asking approves nothing.`
    : waitingOnThem
    ? `${esc(company)} has your message. You can still approve or decline at any time,
       or write again below.`
    : '';

  // Nothing at all on an answered document that was never discussed: an empty
  // "Messages" card under a signature is a heading with no content.
  if (closed && !t.length) return '';

  const composer = closed ? '' : `
    <div class="comp">
      <label class="complab" for="msgbox">${t.length
        ? PL.writeBack : PL.messageCo(esc(firstWord(company)))}</label>
      <textarea id="msgbox" rows="3"
        placeholder="${PL.composerPlaceholder}"></textarea>
      <div class="compr">
        <span class="comphint">${PL.sendingApprovesNothing}</span>
        <button class="compsend" id="msgsend" disabled>${PL.send}</button>
      </div>
      <p class="comperr" id="msgerr" hidden></p>
    </div>`;

  return `<div class="card" id="thread"${o.highlight ? ' style="border-color:var(--orange)"' : ''}>
    <div class="kicker">${o.highlight ? 'New message' : 'Messages'}</div>
    ${t.length ? `<div class="msgs">${msgs}</div>` : ''}
    ${nextStep ? `<p class="clause" style="margin-top:${t.length ? '14' : '6'}px">${nextStep}</p>` : ''}
    ${composer}
    ${closed ? '' : `<p class="recordnote" style="margin-top:12px;text-align:left">If the
      price or the work needs to change, they send you a new version to approve.
      Agreeing to a number in this discussion does not change what you are signing
      above.</p>`}
    <p class="recordnote" style="margin-top:6px;text-align:left">This discussion is
      part of the project record.</p>
  </div>`;
}

/**
 * Attach the composer, and start watching for the moment the thread is actually read.
 *
 * Called after EVERY render that can contain `#thread` -- the three document
 * renderers and every in-place redraw -- from the one place all of them pass through
 * (`renderDocument`) plus `redrawThread`. The DOM is thrown away and rebuilt on each
 * of those, so the listeners are attached to fresh elements and never stack.
 */
function wireThread(d) {
  const box = document.getElementById('msgbox');
  const btn = document.getElementById('msgsend');
  if (box && btn) {
    const sync = () => { btn.disabled = box.value.trim().length === 0; };
    box.addEventListener('input', sync);
    box.addEventListener('keydown', (e) => {
      // Enter sends ON A DESKTOP KEYBOARD only. On a phone the on-screen Return key
      // must insert a line break, because that is what it does in every other box a
      // homeowner has ever typed into -- and a Send that fires on Return is how you
      // deliver half a sentence to somebody holding a price.
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing
          && window.matchMedia('(min-width: 940px)').matches) {
        e.preventDefault();
        if (!btn.disabled) void sendMessage(d);
      }
    });
    sync();
    btn.onclick = () => void sendMessage(d);
  }
  watchThreadSeen(d);
}

/**
 * Mark the conversation read once it has genuinely been on screen.
 *
 * A dwell, not a glance: the card has to be a quarter visible for a beat before the
 * watermark moves. Without the dwell, a thread that happens to sit in the viewport as
 * the page paints -- which it does on a short document -- would be marked read before
 * the client's eyes reached it, and the reply would never be flagged again.
 *
 * No IntersectionObserver (a very old browser) degrades to marking read on render.
 * That is the pre-change behaviour, not a regression: it costs the flag, not a message.
 */
let seenObserver = null;
let seenTimer = null;
function watchThreadSeen(d) {
  if (seenObserver) { seenObserver.disconnect(); seenObserver = null; }
  if (seenTimer) { clearTimeout(seenTimer); seenTimer = null; }
  const host = document.getElementById('thread');
  if (!host) return;
  const settle = () => { markThreadSeen(d); clearUnseenChrome(); };
  if (typeof IntersectionObserver !== 'function') { settle(); return; }
  seenObserver = new IntersectionObserver((entries) => {
    const showing = entries.some((e) => e.isIntersecting);
    if (showing && !seenTimer) seenTimer = setTimeout(settle, 1200);
    else if (!showing && seenTimer) { clearTimeout(seenTimer); seenTimer = null; }
  }, { threshold: 0.25 });
  seenObserver.observe(host);
}

/**
 * THE ONE THING THIS PAGE CAN DO ON OPEN: say a reply is waiting.
 *
 * Drawn into the DOM rather than into a template string because all three document
 * renderers and the project screen need it, and one of them (`renderEwa`) lives in a
 * separate file that must keep working unchanged against an older or newer
 * confirm.html. A DOM insert is the only seam all four already share.
 */
function unseenBannerHtml(d, n) {
  const who = d.company_name || 'your contractor';
  return `<div class="newwrap" id="newbar"><a class="newbar" href="#thread">
      <span class="newn">${n > 9 ? '9+' : n}</span>
      <span class="newt">${n === 1 ? 'New message' : `${n} new messages`} from ${esc(who)}
        <span class="newsub">Tap to read the conversation</span></span>
    </a></div>`;
}

function setTabBadge(n) {
  const glyph = document.querySelector('.tabs .tab[data-tab="messages"] .tabg');
  if (!glyph) return;
  const old = glyph.querySelector('.tabbadge');
  if (old) old.remove();
  if (n > 0) glyph.insertAdjacentHTML('beforeend',
    `<span class="tabbadge">${n > 9 ? '9+' : n}</span>`);
}

function updateUnseenChrome(d) {
  const n = unseenMsgs(d).length;
  setTabBadge(n);
  const existing = document.getElementById('newbar');
  if (!n) { if (existing) existing.remove(); return; }
  if (existing) existing.outerHTML = unseenBannerHtml(d, n);
  else root.insertAdjacentHTML('afterbegin', unseenBannerHtml(d, n));
  const bar = document.getElementById('newbar');
  // Tapping it IS reading it. The anchor already scrolls; this stops the banner
  // outliving the act it was asking for.
  if (bar) bar.addEventListener('click', () => { bar.remove(); setTabBadge(0); });
}

function clearUnseenChrome() {
  const bar = document.getElementById('newbar');
  if (bar) bar.remove();
  setTabBadge(0);
}

/**
 * Redraw ONLY the thread card, never the page.
 *
 * A full re-render would wipe a half-typed signature out of the name field under the
 * client's thumb, and this page exists to collect exactly that signature. It would
 * also throw away whatever they were part-way through typing INTO the thread, which
 * is a new way to lose somebody's words that did not exist before the composer moved
 * here -- so the draft and the focus are carried across the swap by hand.
 */
function redrawThread(d, opts) {
  const host = document.getElementById('thread');
  if (!host) return;
  const box = document.getElementById('msgbox');
  const draft = box ? box.value : '';
  const hadFocus = !!box && document.activeElement === box;
  host.outerHTML = threadHtml(d, opts);
  wireThread(d);
  const fresh = document.getElementById('msgbox');
  if (fresh && draft) {
    fresh.value = draft;
    fresh.dispatchEvent(new Event('input'));
    if (hadFocus) fresh.focus({ preventScroll: true });
  }
  updateUnseenChrome(d);
}

/**
 * Send one message, from the document, without leaving it.
 *
 * The reply is NOT rendered from the local string. The server stamps the time and
 * trims the note, and the thread walks the revision lineage, so drawing our own copy
 * would put a message on screen that differs from the record. It refetches instead.
 */
async function sendMessage(d) {
  const box = document.getElementById('msgbox');
  const btn = document.getElementById('msgsend');
  const err = document.getElementById('msgerr');
  if (!box || !btn) return;
  const body = box.value.trim();
  if (!body) return;

  const fail = (msg) => {
    box.disabled = false; btn.disabled = false; btn.textContent = PL.send;
    if (err) { err.textContent = msg; err.hidden = false; }
  };

  box.disabled = true; btn.disabled = true; btn.textContent = PL.sending;
  if (err) { err.textContent = ''; err.hidden = true; }

  let data, error;
  try {
    ({ data, error } = await supabase.rpc('confirmation_ask', {
      p_token: token, p_note: body, p_user_agent: navigator.userAgent,
    }));
  } catch (e) {
    // A thrown fetch is a dead link, not a refusal. Say so where they are, and keep
    // their words in the box -- retyping a paragraph is how a person gives up.
    fail('That didn’t send. Nothing was recorded — check your signal and try again.');
    return;
  }

  if (error) {
    // A message can be refused for one reason that is NOT a network problem: the link
    // was retired while this page was open (250 + confirmation_question_not_
    // superseded). Saying "that didn't send, tap again" there would send them round a
    // loop that can never succeed, on a document that no longer exists.
    if ((error.message || '').includes('replaced by a newer one') ||
        error.hint === 'link_superseded' || error.hint === 'link_cancelled') {
      screen(`<div class="done"><div class="mark err">🔄</div>
        <h2>This version was replaced</h2>
        <p>The contractor sent an updated version while this page was open. Your
           message was not sent. Please open the most recent link they texted
           you.</p></div>`);
      return;
    }
    fail('That didn’t send. Nothing was recorded — please try again.');
    return;
  }

  if (data && data.status === 'already_answered') {
    done('✅', 'Already answered', 'Your first answer stands.');
    return;
  }

  box.value = '';
  await loadThread(d);
  redrawThread(d);
  // A reply is likeliest in the minutes after a client writes. Poll harder for a
  // while, then fall back -- this is a phone battery, not a chat server.
  hotPollUntil = Date.now() + REPLY_HOT_WINDOW_MS;
  const card = document.getElementById('thread');
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

/**
 * Pull one labelled section out of the FROZEN wording.
 *
 * WHY READ THE INSTRUMENT INSTEAD OF ADDING FIELDS (hadar, 2026-08-05: "the
 * recipient needs to be clear and upfront with the SOW, who is it from and what are
 * the terms -- but first the SOW"). This page received `scope_title` and a price and
 * nothing else: the actual scope text AND every flow term -- what is not included,
 * when payment is due, what it does to the schedule -- existed only inside the
 * collapsed "See the exact wording" box. A client could approve a priced change
 * order having never seen the exclusions.
 *
 * Adding frozen columns for each would work and would also create a second copy of
 * contractual text that can disagree with the instrument. Reading the sections OUT
 * of shown_content cannot drift by construction: what is rendered IS what is signed
 * and hashed (240_shown_content_integrity).
 *
 * Returns null for anything sent before the sections existed, and every caller falls
 * back to the previous layout rather than showing an empty heading.
 *
 * ── THE ESCAPE BUG THIS FUNCTION SHIPPED WITH, recorded because the failure was
 *    SILENT and the fallback hid it ──────────────────────────────────────────────
 * The character class was written `'[\s\S]'` inside an ordinary JavaScript string.
 * `\s` is not a recognised string escape, so the literal collapses to the two
 * characters `s` and `S` and the regex compiled as `([sS]*?)` — a class matching only
 * the letter s. It therefore matched NOTHING for every real document, `docSection`
 * returned null on both calls, and `renderPriced`'s two fallbacks quietly took over:
 * no SCOPE OF WORK block and no TERMS block on the page.
 *
 * The effect was the exact defect this function was written on 2026-08-05 to fix
 * (hadar: "the recipient needs to be clear and upfront with the SOW … but first the
 * SOW"). A client could approve a priced change order having seen a title, a number,
 * and nothing about what is excluded, when payment is due, or what it does to the
 * schedule — all of which were sitting inside the collapsed raw wording, which is
 * where they were before the fix. Nothing threw, nothing logged, and the page looked
 * deliberate. Verified by running the old expression against a real `shown_content`.
 *
 * `[\\s\\S]` is the correct escaping in a string literal. It is written that way
 * rather than as a regex literal because `heading` is interpolated.
 */
function docSection(txt, heading) {
  if (!txt) return null;
  var re = new RegExp('(?:^|\n)' + heading + '\n([\\s\\S]*?)(?=\n\n[A-Z][A-Z &]{2,}\n|\n\nNothing proceeds|$)');
  var m = txt.match(re);
  return m && m[1].trim() ? m[1].trim() : null;
}

/**
 * The SCOPE OF WORK block, split into the sections the contractor's own document
 * already carries (hadar's design, 2026-08-10).
 *
 * PARSED FROM THE FROZEN TEXT, NEVER FROM THE LIVE COLUMNS. The worker writes these
 * sections into `change_order` and `renderScope()` composes them into the instrument;
 * reading the columns here would be a second source for the same words, and the day
 * they disagree the client is signing one thing and reading another. So this splits
 * `shown_content` — the exact string the signature covers — and every character
 * rendered below came out of it.
 *
 * THE HEADINGS ARE THE DOCUMENT'S OWN, title-cased. The design labels them "Change to
 * the work" / "Included" / "Not included"; the document says "WHAT WILL BE DONE" /
 * "WHAT THIS INCLUDES" / "WHAT THIS DOES NOT INCLUDE". Friendlier words would be an
 * editorial rewrite of a legal document's section headings by the page that displays
 * it, which is the drift mandate #5 exists to stop. Case is presentation; wording is
 * not. The full untouched text stays one tap away under "See the exact wording".
 */
var SEC_ICONS = {
  'WHY THIS IS NEEDED':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
  'WHAT WILL BE DONE':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
  'WHAT THIS INCLUDES':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  'WHAT THIS DOES NOT INCLUDE':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m18 6-12 12"/><path d="m6 6 12 12"/></svg>',
  'CONDITIONS':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
  'SCHEDULE':
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>',
};

function titleCase(h) {
  var t = String(h || '').toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/** Ordered [{heading, body}] out of the SCOPE OF WORK block. Empty when the document
 *  predates the sections — the caller then falls back to the plain block, so an older
 *  instrument renders exactly as it always did rather than as an empty list. */
function scopeSections(shown) {
  // NOT docSection(). That helper stops at the next ALL-CAPS line — and every
  // sub-heading inside the scope IS an all-caps line, so it returned only WHY THIS IS
  // NEEDED and silently dropped WHAT WILL BE DONE, WHAT THIS INCLUDES, WHAT THIS DOES
  // NOT INCLUDE and CONDITIONS. The client was shown one fifth of the work and the
  // exclusions were not on the page at all, which is the single most expensive thing
  // this document can omit.
  //
  // So the block is taken from SCOPE OF WORK to the next TOP-LEVEL band (FROM /
  // TERMS), and split inside.
  var m = String(shown || '').match(/(?:^|\n)SCOPE OF WORK\n([\s\S]*?)(?=\n\nFROM\n|\n\nTERMS\n|$)/);
  var sow = m && m[1].trim();
  if (!sow) return [];
  var out = [];
  var lines = sow.split('\n');
  var cur = null;
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    // A heading is a whole line of capitals. Same shape the app's own scope block
    // tests for, so the two screens agree about what a heading is.
    if (/^[A-Z][A-Z '&]{2,}$/.test(ln.trim())) {
      cur = { heading: ln.trim(), body: [] };
      out.push(cur);
    } else if (cur) {
      cur.body.push(ln);
    }
  }
  return out
    .map(function (s) { return { heading: s.heading, body: s.body.join('\n').trim() }; })
    .filter(function (s) { return s.body; });
}

function sectionsHtml(shown) {
  var secs = scopeSections(shown);
  if (!secs.length) return null;
  return secs.map(function (s) {
    var icon = SEC_ICONS[s.heading] || SEC_ICONS['CONDITIONS'];
    var danger = s.heading.indexOf('NOT INCLUDE') >= 0;
    return '<div class="sec">'
      + '<span class="secico' + (danger ? ' warn' : '') + '">' + icon
      // The design marks the exclusions with a dot. It is the one section a reader
      // skims past and the one whose absence costs money later.
      + (danger ? '<i class="secdot"></i>' : '') + '</span>'
      + '<div><div class="sech">' + esc(titleCase(s.heading)) + '</div>'
      + '<div class="secb">' + esc(s.body) + '</div></div></div>';
  }).join('');
}

/**
 * The one-line "we did the thing you just tapped" banner.
 *
 * Its own function because all three document renderers need it and the EWA renderer
 * lives in another file. Green, at the top, above the fold: the client has just come
 * back from a screen that took over the whole page, and without an acknowledgement
 * the return reads as the tap having been ignored.
 */
function noticeHtml(text) {
  if (!text) return '';
  return `<div class="wrap"><div class="notice">${esc(text)}</div></div>`;
}

/**
 * DESIGN PREVIEW (hadar, 2026-08-10: "even if you need to place pho[ny] data for now").
 *
 * The portal's letterhead, contact card, project photo and change-order number are
 * all real columns with nothing in them yet — so the design cannot be judged, because
 * half its elements have no content to draw. `?demo=1` fills ONLY the empty ones with
 * obvious sample content so the layout can be reviewed.
 *
 * THREE RULES, because putting invented text on an approval page is otherwise exactly
 * the thing this product must never do:
 *   1. OPT-IN BY URL. It is unreachable from any link the app mints; a client can
 *      only see it by typing the parameter themselves.
 *   2. IT NEVER TOUCHES THE INSTRUMENT. The price, the scope, the frozen wording, the
 *      signature and the thread are untouched — it fills letterhead and chrome only.
 *      Nothing here can change what a document says or what approving it means.
 *   3. IT ONLY FILLS BLANKS. A real value always wins, so a preview of a filled-in
 *      account shows the account, not the sample.
 * The page also says out loud that it is a preview, so a screenshot of it can never
 * be mistaken for a real client's page.
 */
function applyDemo(d) {
  if (!demo) return;
  d.__company = Object.assign({
    name: d.company_name || 'ABC Construction Company',
    tagline: 'Built with care.',
    address: '123 Any Street, Anytown, ST 12345',
    phone: '(555) 123-4567',
    email: 'info@abcconstruction.com',
  }, d.__company || {}, {
    // Object.assign keeps a real null over the sample, so blanks are filled explicitly.
    tagline: (d.__company && d.__company.tagline) || 'Built with care.',
    address: (d.__company && d.__company.address) || '123 Any Street, Anytown, ST 12345',
    phone: (d.__company && d.__company.phone) || '(555) 123-4567',
    email: (d.__company && d.__company.email) || 'info@abcconstruction.com',
  });
  d.__contact = d.__contact || {
    name: 'John Davis', title: 'Project Manager',
    phone: '(555) 987-6543', email: 'john@abcconstruction.com',
  };
  // The hero has no column yet. In preview it borrows the first photograph already
  // attached to this change order — a real picture of this job, so the slot shows what
  // it will look like without inventing an image.
  if (d.__project && !d.__project.hero_url && d.photos && d.photos.length) {
    d.__project.hero_url = d.photos[0].url;
  }
  d.__header = Object.assign({}, d.__header, {
    co_number: (d.__header && d.__header.co_number) != null ? d.__header.co_number : 4,
    requested_by: (d.__header && d.__header.requested_by) || 'John Davis',
  });
}

/**
 * THE LETTERHEAD — who is asking, and how to reach them (402).
 *
 * WHY IT IS ON A LEGAL DOCUMENT. A homeowner is being asked to authorise money by a
 * link that arrived in a text from a number they may not have saved. Every paper
 * change order carries the contractor's letterhead and a human being to call. A page
 * showing a price and a bare company name is asking for a signature while withholding
 * the two facts that make it checkable.
 *
 * EVERY FIELD IS OPTIONAL AND BLANKS ARE OMITTED, NOT LABELLED. A contractor who has
 * filled in a phone and nothing else gets a shorter card, not a card with four empty
 * rows. "Not set" beside a price is noise on the one screen that must not have any.
 *
 * The contact is the person who SENT this document, not the company owner — on a
 * bigger crew those differ, and the client should call whoever actually raised it.
 */
function letterheadHtml(d) {
  const c = d.__company;
  const p = d.__contact;
  const name = (c && c.name) || d.company_name;
  if (!name && !p) return '';

  const lines = [];
  if (c && c.address) lines.push(esc(c.address));
  const contactBits = [];
  if (c && c.phone) contactBits.push(esc(c.phone));
  if (c && c.email) contactBits.push(esc(c.email));
  if (contactBits.length) lines.push(contactBits.join('&nbsp;&nbsp;|&nbsp;&nbsp;'));

  const person = p && (p.name || p.phone || p.email) ? `
    <div class="lhperson">
      <div class="lhav">${esc(initials(p.name || name || '?'))}</div>
      <div>
        ${p.name ? `<div class="lhpn">${esc(p.name)}</div>` : ''}
        ${p.title ? `<div class="lhpt">${esc(p.title)}</div>` : ''}
        ${p.phone ? `<div class="lhpc"><a href="tel:${esc(String(p.phone).replace(/[^+\d]/g, ''))}">${esc(p.phone)}</a></div>` : ''}
        ${p.email ? `<div class="lhpc"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>` : ''}
      </div>
    </div>` : '';

  return `<div class="card lh">
    <div class="lhco">
      ${logoTile(name, d.__logoUrl)}
      <div>
        <div class="lhcn">${esc(name || '')}</div>
        ${c && c.tagline ? `<div class="lhtag">${esc(c.tagline)}</div>` : ''}
        ${lines.map((l) => `<div class="lhline">${l}</div>`).join('')}
      </div>
    </div>
    ${person}
  </div>`;
}

/**
 * The job on the left, the document's own number on the right — the design's second
 * band, and the shape a paper change order has always had. `identityHtml` used to
 * render this as one wrapped line under the price; here it is a two-column block at
 * the head of the document, where a reader looks for "which job, which document".
 */
function jobIdentityHtml(d) {
  const h = d.__header || {};
  const pr = d.__project;
  const bits = [];
  if (h.issued_at) bits.push(`Issued: ${esc(new Date(h.issued_at).toLocaleDateString(undefined,
    { month: 'short', day: 'numeric', year: 'numeric' }))}`);
  if (h.requested_by) bits.push(`Requested by: ${esc(h.requested_by)}`);
  const job = (pr && pr.project_name) || d.job_label || '';
  // TWO ADDRESSES FOR ONE JOB IS WORSE THAN ONE.
  //
  // The design's band is a NAME over its address ("The Robinson Residence" / "123 Any
  // Street"). Real projects are often named BY their address, and this account has a
  // name of "1155 Stanyan st, San Francisco 94117" beside a stored address of "1-99
  // Stockton St · San Francisco, CA" — two different streets, stacked, on the document
  // that says where the work happens. A reader cannot tell which one is the job.
  //
  // So the address line is suppressed whenever the name is itself address-shaped: the
  // contractor's own label for the job wins, and the document states one location.
  // When the name is a real name ("The Robinson Residence") the address prints under
  // it exactly as drawn.
  const nameIsAddress = /\d/.test(job) && /\b(st|street|ave|avenue|rd|road|blvd|dr|drive|ln|lane|way|ct|court|pl|place)\b/i.test(job);
  const addr = (pr && pr.project_address && pr.project_address !== job && !nameIsAddress)
    ? pr.project_address : '';
  if (!job && !bits.length && h.co_number == null) return '';
  return `<div class="idgrid">
    <div>
      <div class="idjob">${esc(job)}</div>
      ${addr ? `<div class="idaddr">${esc(addr)}</div>` : ''}
    </div>
    <div>
      <div class="idn">${h.co_number != null ? `Change order #${esc(String(h.co_number))}` : 'Change order'}</div>
      ${bits.map((b) => `<div class="idm">${b}</div>`).join('')}
    </div>
  </div>`;
}

/**
 * The document's headline.
 *
 * `scope_title` is FROZEN on the request, and every confirmation sent between 391 and
 * 2026-08-10 froze the entire scope-of-work document into it (confirmations.ts passed
 * `value` where `subject` belonged). The trigger refuses to correct it — correctly,
 * because nothing the signer saw may change after they saw it.
 *
 * So when the frozen field is clearly not a title, the real one is taken from the
 * project view, which reads `change_order.scope`. Both strings are the contractor's
 * own words; this only picks the one that is a title. If neither is available it says
 * "Extra work" rather than shouting a thousand characters, which is what it did.
 */
function headline(d) {
  const frozen = (d.scope_title || '').trim();
  const isProse = frozen.length > 90 || frozen.includes('\n');
  if (frozen && !isProse) return frozen;
  const orders = (d.__project && Array.isArray(d.__project.orders)) ? d.__project.orders : [];
  const mine = orders.find((o) => o.token === token);
  const real = mine && (mine.title || '').trim();
  if (real && real.length <= 120) return real;
  return 'Extra work';
}

/**
 * THE PRICED CHANGE ORDER — rebuilt to the portal design's information architecture
 * (hadar, 2026-08-10: "the structure is wrong, the division of the information in the
 * different sections is wrong, and the way the information is presented is wrong").
 *
 * WHAT WAS ACTUALLY WRONG, since three rounds of CSS did not fix it: the page was an
 * app screen made of stacked cards — kicker, title, price, terms, photos, totals —
 * each a peer of the others. The design is a DOCUMENT: one sheet, read top to bottom,
 * whose bands answer a fixed sequence of questions.
 *
 *   1. WHO IS ASKING          letterhead + the human to call
 *   2. ABOUT WHICH JOB        job address | this document's own number and date
 *   3. FOR WHAT, AND HOW MUCH the work, in words, beside the number
 *   4. WHAT EXACTLY           the sections, beside the photographs of them
 *   5. WHEN                   schedule impact, its own band, with the new end date
 *   6. WHAT IT DOES TO THE $  contract summary
 *   7. WHAT SIGNING MEANS     the approval paragraph
 *   8. THE ACT                approve · ask · decline
 *
 * That order is not decoration. It is the order a person needs the facts in before
 * they can honestly agree, and every band that moves out of it makes somebody sign
 * something they have not finished reading.
 *
 * THE PARTS THE DESIGN DOES NOT DRAW, KEPT ANYWAY, and where they went:
 *   * DECLINE. PRD R5 has three outcomes and the design shows two. A page offering
 *     only "approve" and "ask" makes refusing feel like something you have to go
 *     around the app to do. It sits under the two buttons as a quiet link.
 *   * THE SIGNATURE FIELD. Approval is a signature (mandate #2, REQ-VAL). The design
 *     shows a bare Approve button; that button stays disabled until a name is typed,
 *     with the field above it and labelled.
 *   * "SEE THE EXACT WORDING". Mandate #5 — what is signed is the frozen text, and it
 *     must be reachable. It joins the footer row beside Print.
 */
function renderPriced(d, notice) {
  // OPEN or ANSWERED — the same document. Only the band at the top and the band at
  // the bottom differ; everything between them is the record and does not change
  // because somebody signed it.
  const answered = d.status === 'already_answered';
  const company = (d.__company && d.__company.name) || d.company_name || 'Your contractor';
  const priced = usd(d.amount_cents);
  const isNte = d.nte_cents != null;

  const secs = sectionsHtml(d.shown_content);
  const sow = docSection(d.shown_content, 'SCOPE OF WORK');
  const termsBlock = docSection(d.shown_content, 'TERMS');

  // The TERMS block, split into the one line that gets its own band (schedule) and
  // the rest. Price lines are dropped: the figure is rendered large above and a
  // second quieter copy reads as a different number.
  const termLines = (termsBlock || '').split('\n')
    .map((l) => l.trim())
    .filter((l) => l && !/^Price:/.test(l) && !/^Not to exceed:/.test(l)
                    && !/^Work will not exceed /.test(l));
  const scheduleLine = termLines.find((l) => /^Schedule:/i.test(l)) || null;
  // "Not included:" is already a section with its own mark and its own list. Repeating
  // it as a run-on line under Terms made the exclusions appear twice, once formatted
  // and once as a paragraph with bullets inside it.
  const otherTerms = termLines.filter((l) => l !== scheduleLine)
    .filter((l) => !/^Not included:/i.test(l) && !/^•/.test(l));

  // A ONE-LINE SUMMARY UNDER THE TITLE, taken from the document's own opening
  // sentence. The design has a written summary; nothing in the schema stores one, and
  // inventing a sentence to describe a legal document is not on the table. The first
  // sentence of WHY THIS IS NEEDED is the contractor's own words and is already in
  // the instrument, so it restates nothing and adds nothing.
  // NO LEDE. It was the first sentence of WHY THIS IS NEEDED — which renders in full
  // as the first section immediately below, so the page said the same thing twice,
  // eight lines apart. The design's one-liner is a SEPARATE written summary; nothing
  // stores one, and repeating a section to fill the slot is worse than an empty slot.
  const lede = '';

  screen(`
    <div class="shell">
    ${sidebarHtml(d)}
    <div class="main">
    ${d.__project ? `<div class="backbar"><a href="?t=${encodeURIComponent(token)}&v=project">← All change orders</a></div>` : ''}
    ${noticeHtml(notice)}
    ${demo ? '<div class="wrap"><div class="demobar">Design preview — the letterhead and contact details on this page are sample text, not this account\u2019s.</div></div>' : ''}
    ${/* NO SEPARATE BANNER WHEN ANSWERED (hadar, 2026-08-10: "an approved change
         order looks like this -- just read only and with a sign approved -- it is
         not different"). An answered document is the SAME page: same sidebar, same
         letterhead, same bands, same order. The only difference is that the controls
         at the bottom have become a stamp. A status band across the top would be a
         second difference, and the instruction was that there is one. */ ''}
    ${changesHtml(d)}
    <div class="wrap">
      <div class="sheet">

        ${letterheadHtml(d)}
        ${jobIdentityHtml(d)}

        <div class="band bandtitle">
          <div class="btmain">
            <h1 class="doctitle">${esc(headline(d))}</h1>
            ${lede ? `<p class="doclede">${esc(lede)}</p>` : ''}
          </div>
          <div class="btprice">
            <div class="pvbig">${esc(priced)}</div>
            <div class="pvlab">${isNte ? 'Not to exceed' : 'Fixed price'}</div>
          </div>
        </div>

        <div class="band bandbody">
          <div class="bsecs">
            ${secs || (sow ? `<div class="sow">${esc(sow)}</div>` : '')}
          </div>
          <div class="bshots">
            ${photoStrip(d.photos)}
          </div>
        </div>

        ${costBand(d)}

        ${scheduleLine ? `
        <div class="band bandsched">
          <div class="sec" style="border:0;padding:0">
            <span class="secico">${SEC_ICONS['SCHEDULE']}</span>
            <div><div class="sech">${PL.schedBand}</div>
              <div class="secb">${esc(sentence(scheduleLine.replace(/^Schedule:\s*/i, '')))}</div></div>
          </div>
        </div>` : ''}

        ${otherTerms.length ? `
        <div class="band">
          <div class="bandh">${PL.termsBand}</div>
          ${otherTerms.map((l) => `<div class="tline">${esc(l)}</div>`).join('')}
        </div>` : ''}

        ${nteBand(d)}
        ${summaryBand(d)}

        <div class="band">
          <div class="bandh">${PL.approvalBand}</div>
          <!-- THE PARAGRAPH IS PART OF THE DOCUMENT, not part of the form. It states
               what approving MEANS, and it is exactly as relevant to someone reading
               back what they agreed to as to someone deciding. It stays on both. -->
          <p class="apara">${PL.authorise(esc(company))}${answered ? '' : `
            Nothing proceeds until you approve.`}</p>
          ${answered ? stampHtml(d) : `
          <label class="signlab" for="name">${PL.signLabel}</label>
          <input class="sign" id="name" placeholder="${PL.signPlaceholder}" autocomplete="name">
          <div class="acts">
            <button class="approve" id="approve" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              ${PL.approve(isNte ? esc(usd(d.nte_cents)) : esc(priced))}</button>
            <button class="ghost askbtn" id="ask">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
              <span><b>Have a question?</b><br>Message ${esc(firstWord(company))}</span></button>
          </div>
          <button class="linkbtn" id="decline">${PL.decline}</button>
          <p class="recordnote">Your response, your name, and the date and time become
            part of the project record. No account needed.</p>`}
        </div>

        <div class="band bandfoot">
          <a href="#" id="exact">See the exact wording</a>
          <span>|</span>
          <a href="#" id="printit">Print or save as PDF</a>
          ${d.__changes && d.__changes.versions > 1
            ? `<span>|</span><a href="#thread">View previous versions (${esc(String(d.__changes.versions))})</a>` : ''}
        </div>
        <details class="exact" id="exactbox">
          <summary>The exact wording</summary>
          <div class="doc">${esc(d.shown_content)}</div>
        </details>
      </div>

      ${threadHtml(d)}
    </div>
    </div>
    </div>
    ${tabsHtml(d, null)}`);

  if (d.__project) document.body.classList.add('hastabs');

  if (!answered) {
    const nameEl = document.getElementById('name');
    const approveEl = document.getElementById('approve');
    nameEl.addEventListener('input', () => { approveEl.disabled = nameEl.value.trim().length < 2; });
    approveEl.onclick = () => answer('confirmed', null, nameEl.value.trim());
    document.getElementById('ask').onclick = () => askQuestion(d);
    document.getElementById('decline').onclick = () => declineFlow(d);
  }
  const sideAsk = document.getElementById('asksidebar');
  if (sideAsk) sideAsk.onclick = () => askQuestion(d);
  document.getElementById('printit').onclick = (e) => { e.preventDefault(); window.print(); };
  document.getElementById('exact').onclick = (e) => {
    e.preventDefault();
    const box = document.getElementById('exactbox');
    box.open = true; box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
}

/**
 * THE APPROVED STAMP — the single difference between an open document and a signed
 * one. It sits where the name field and the buttons were, in the same band, so the
 * page's shape does not move when a client returns to it.
 *
 * A record, not a control. The server refuses a second answer, so there is no button
 * here that could work; showing one would be an invitation to a refusal.
 */
function stampHtml(d) {
  const approved = d.answered_action === 'confirmed';
  const when = d.answered_at
    ? new Date(d.answered_at).toLocaleString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';
  return `<div class="stamp ${approved ? 'ok' : 'no'}">
    <span class="stampmark">${approved ? '✓' : '✋'}</span>
    <span>
      <span class="stampt">${approved ? PL.approved : PL.declinedStamp}</span>
      <span class="stampm">${d.signed_name ? `Signed ${esc(d.signed_name)}` : 'Answered'}${when ? ` · ${esc(when)}` : ''}</span>
      <span class="stampm">This is the exact wording, kept as it was when you answered. It does not change.</span>
    </span>
  </div>`;
}

/**
 * The status band on an ANSWERED document — what the amber "updated" band is to an
 * open one. It says what happened, who signed, and when, and it says the record is
 * closed rather than inviting an action that would be refused.
 */
function answeredBanner(d) {
  const approved = d.answered_action === 'confirmed';
  const when = d.answered_at
    ? new Date(d.answered_at).toLocaleString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';
  return `<div class="wrap"><div class="abar ${approved ? 'ok' : 'no'}">
    <span class="amark">${approved ? '✓' : '✋'}</span>
    <span>
      <span class="awhen">${approved ? PL.approved : PL.declined}${d.signed_name ? PL.signedBy(esc(d.signed_name)) : ''}</span>
      <span class="alead">${when ? `Answered ${esc(when)}. ` : ''}Your answer stands. This page keeps the document exactly as it was.</span>
    </span>
  </div></div>`;
}

/**
 * The bottom band on an answered document: the signature as a RECORD, not a form.
 *
 * No name field, no Approve, no Decline — the server refuses a second answer and a
 * control that cannot work is worse than no control. Asking a question stays
 * available through the sidebar where the thread is still open.
 */
function signedBand(d) {
  const approved = d.answered_action === 'confirmed';
  const when = d.answered_at ? new Date(d.answered_at).toLocaleString() : '';
  return `<div class="band">
    <div class="bandh">${approved ? 'Approved' : 'Declined'}</div>
    <table class="csum">
      ${d.signed_name ? `<tr><td>Signed by</td><td>${esc(d.signed_name)}</td></tr>` : ''}
      ${when ? `<tr><td>Answered</td><td>${esc(when)}</td></tr>` : ''}
      <tr class="tot"><td>Outcome</td><td>${approved ? 'Approved' : 'Declined — do not proceed'}</td></tr>
    </table>
    <p class="csumnote">This is the exact wording, kept as it was when you answered.
      It does not change.</p>
  </div>`;
}

/** "Dealer deale" -> "Dealer". The design addresses a person by first name on the ask
 *  button; with no contact on file the company's first word is the closest true
 *  thing, and it is never a name we made up. */
function firstWord(s) { return String(s || '').trim().split(/\s+/)[0] || 'them'; }

/** "no change." -> "No change". The frozen text composes these as sentence fragments
 *  inside a paragraph; lifted out into a row of their own they need a capital and no
 *  trailing stop. Presentation only — not a word is changed. */
function sentence(s) {
  var t = String(s || '').trim().replace(/\.$/, '');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/** The not-to-exceed clause, as its own band. PRD R3: a cap is a different instrument
 *  from a fixed price and the qualifying sentence is part of it, not a footnote. */
function nteBand(d) {
  if (d.nte_cents == null) return '';
  return `<div class="band"><div class="bandh">Not to exceed</div>
    <p class="apara">Work will not exceed ${esc(usd(d.nte_cents))} without a new approval.</p></div>`;
}

/** Contract summary as a band inside the sheet, not a card beside it. */
/**
 * WHAT THE PRICE IS MADE OF — the parts, when the job was quoted in parts.
 *
 * hadar, 2026-08-24: "if there were a separation of cost by part (breakdown) this
 * breakdown needs to be displayed clearly and that is true for the homeowners side
 * (client portal)." The page showed one large figure and nothing behind it, so a
 * total assembled from three pieces the contractor quoted out loud was indistinguishable
 * from a number he typed. This is the band a homeowner reads to answer "what am I
 * paying for", and it sits directly under the scope for that reason.
 *
 * FROZEN, LIKE EVERY OTHER FIGURE ON THIS PAGE. `line_items` is a column on
 * confirmation_request, written at send and locked by the tamper guard (200). It is
 * NOT a live read of the draft: a signer who approved $400 + $1,250 + $750 must see
 * those three numbers years later even if the extra was re-priced since.
 *
 * IT NEVER SUMS THE ROWS. The total shown is `amount_cents` — the figure at the top of
 * the page and the figure on the Approve button — because a self-summed total could
 * disagree with the one being signed, and the number beside a signature must have
 * exactly one source. If the parts do not add up to the total, that is a fact the
 * reader is entitled to SEE, not something this function should paper over.
 *
 * ABSENT ON MOST DOCUMENTS. One price for the whole job has no parts, and a one-row
 * table restating the headline figure is noise. Renders nothing for a null, a
 * non-array, an empty array, or a server that predates the column.
 */
function costBand(d) {
  const lines = Array.isArray(d.line_items) ? d.line_items : [];
  const rows = lines
    .filter((l) => l && typeof l.description === 'string' && typeof l.total_cents === 'number')
    .map((l) => {
      // A quantity earns its place only when it is not 1: "1 x $900" beside a $900
      // total is the same number said twice.
      const qty = (typeof l.qty === 'number' && l.qty > 1 && typeof l.unit_cents === 'number')
        ? `<span class="cbqty">${esc(String(l.qty))} × ${esc(usd(l.unit_cents))}</span>` : '';
      return `<tr><td>${esc(l.description)}${qty}</td><td>${esc(usd(l.total_cents))}</td></tr>`;
    });
  if (!rows.length) return '';
  /**
   * NO "TOTAL" ROW ON A CAPPED DOCUMENT (Codex, adversarial review 2026-08-24).
   *
   * On a not-to-exceed change order `amount_cents` and `nte_cents` are different numbers
   * and the Approve button signs the CAP. A row labelled "Total" showing amount_cents
   * would sit a few inches above a button reading "Approve $2,500" and state a different
   * figure, on the one page where a person is deciding whether to agree to a number.
   *
   * The parts are still listed — they are what the work is made of and that does not
   * change. What is withheld is a total this page is not the right place to assert:
   * `nteBand` states the cap in words, and the headline states the figure.
   *
   * NOTE, and NOT fixed here because it predates this band and changes how every capped
   * document has read for months: the headline shows `amount_cents` under the label "Not
   * to exceed" while the button signs `nte_cents`. That is the same disagreement one
   * level up. Flagged to hadar rather than changed unilaterally.
   */
  if (d.amount_cents != null && d.nte_cents == null) {
    rows.push(`<tr class="tot"><td>Total</td><td>${esc(usd(d.amount_cents))}</td></tr>`);
  }
  return `<div class="band"><div class="bandh">What it costs, by part</div>
    <table class="csum">${rows.join('')}</table></div>`;
}

function summaryBand(d) {
  const pr = d.__project;
  const prior = pr ? pr.approved_total_cents : d.approved_running_cents;
  if (prior == null && d.amount_cents == null) return '';
  const rows = [];
  if (prior != null) rows.push(`<tr><td>Change orders you have already approved</td><td>${esc(usd(prior))}</td></tr>`);
  if (d.amount_cents != null) rows.push(`<tr class="this"><td>This change order</td><td>+ ${esc(usd(d.amount_cents))}</td></tr>`);
  if (prior != null && d.amount_cents != null) {
    rows.push(`<tr class="tot"><td>Total in change orders if you approve</td><td>${esc(usd(prior + d.amount_cents))}</td></tr>`);
  }
  return `<div class="band"><div class="bandh">Contract summary</div>
    <table class="csum">${rows.join('')}</table>
    <p class="csumnote">These figures cover change orders on this job only. They do not
      include your original contract amount.</p></div>`;
}

// ASK A QUESTION — not a decline, and no longer a different page.
//
// This used to call answer('declined', …), which permanently declined the item and
// burned the single-use token, so a client who asked a question could never approve
// afterwards. A question is now a message on its own thread: it commits nobody, needs
// no signature, and leaves Approve live — PRD R5b, "the Approve button remains pinned
// at every point in the thread".
//
// ── IT NO LONGER OPENS A SCREEN (hadar, 2026-08-24) ────────────────────────────
// The fix above left one thing wrong: asking still *replaced the document* with a
// bare "What's your question?" textarea. So the moment a homeowner decided to ask
// about the price, the price left the screen — along with the contractor's last
// message and their own earlier question, which are the three things anybody rereads
// before pressing send. Every "Message <name>" control on this page — the actions
// band, the sidebar, the EWA's "Ask a question instead", the project list — now means
// the same thing: put the cursor in the box that is already on the page.
//
// It takes no argument and ignores any it is given. ewa.js calls `h.askQuestion(d)`
// and is a separately uploaded object that must keep working unchanged.
function askQuestion() {
  const box = document.getElementById('msgbox');
  const card = document.getElementById('thread');
  if (box || card) {
    (card || box).scrollIntoView({ behavior: 'smooth', block: 'center' });
    // `preventScroll` so the smooth scroll above is not cut short by the browser
    // jumping the field into view itself.
    if (box) box.focus({ preventScroll: true });
    return;
  }
  // No conversation on this screen — the phone's project list. The thread lives at
  // the document's address; go there rather than opening a second place to type.
  if (token) location.href = `?t=${encodeURIComponent(token)}#thread`;
}

// DECLINE — a real, terminal, signed answer. It stops work and the contractor acts
// on it, so it carries the same signature an approval does: unsigned, anyone holding
// the link could halt a job. The reason stays optional; demanding an explanation to
// say no is how you get no answer at all.
function declineFlow(d) {
  screen(`
    <div class="wrap" style="padding-top:24px">
      <h1 class="plain">Decline this?</h1>
      <p class="recordnote" style="margin:0 0 10px">This tells ${esc(d.company_name || 'the contractor')}
        not to proceed. It is final and becomes part of the project record.</p>
      <textarea id="note" placeholder="Optional — why?"></textarea>
      <input class="sign" id="dname" placeholder="Type your full name to sign" autocomplete="name">
      <div class="btns">
        <button class="decline" id="send" disabled>Decline — do not proceed</button>
        <button class="ghost" id="back">Back</button>
      </div>
    </div>`);
  const dn = document.getElementById('dname');
  const sendEl = document.getElementById('send');
  dn.addEventListener('input', () => { sendEl.disabled = dn.value.trim().length < 2; });
  sendEl.onclick = () =>
    answer('declined', document.getElementById('note').value, dn.value.trim());
  // Back goes through the ONE dispatch. This line used to re-decide the document type
  // from `amount_cents`, which is null for an EWA as well as for a legacy confirm — so
  // backing out of a decline on an authorization redrew it as a plain confirmation
  // with its proceed term and settlement window gone, still offering a signature.
  document.getElementById('back').onclick = () => renderDocument(d);
}

// Legacy no-price confirmation (a decision, no cost change). Kept working.
function renderPlain(d, notice) {
  const verb = d.kind === 'confirm' ? 'confirm' : 'acknowledge';
  screen(`
    ${noticeHtml(notice)}
    <div class="wrap" style="padding-top:24px">
      <div class="who">For ${esc(d.counterparty)}</div>
      <h1 class="plain">Please read this and ${verb} it.</h1>
      <div class="plaincard">${esc(d.shown_content)}</div>
      ${/* An EWA (PRD R3 step 1) is "condition description + photos" and carries no
            price, so it renders through here. Leaving the strip off this path would
            drop the photos from the one instrument whose entire content IS the
            condition being photographed. */ ''}
      ${photoStrip(d.photos)}
      ${/* The discussion was MISSING from this renderer entirely, while the "Ask a
            question instead" button below has always been offered here. So a client
            on a plain confirmation could ask, and then never see their own question,
            never see the answer, and have no evidence either had happened. The same
            hole as DEF-5, on the third of the three documents. */''}
      ${threadHtml(d)}
      <input class="sign" id="name" placeholder="Type your full name to sign" autocomplete="name">
      <div class="btns">
        <button class="yes" id="yes" disabled>Yes — that's right</button>
        <button class="no" id="no">No — that's not right</button>
        <button class="ghost" id="askp">Ask a question instead</button>
      </div>
      <p class="recordnote">Your answer, your name, and the date &amp; time become part of the project record. No account needed.</p>
    </div>`);
  // A Decision is signed like any other item (PRD R10). It carries no money, but a
  // confirmed spec — "the vanity is 34 inches" — is exactly what a rework argument
  // turns on months later, so it is worth the same signature as a priced extra.
  //
  // Saying NO is signed too. This line used to read "Saying NO still needs no name:
  // identity is not the price of declining" — true once, and left behind when declines
  // became signed (declineFlow below, enforced by 210_approval_signature.sql). It
  // described a path that no longer exists, in the one file where a maintainer might
  // believe it and take the signature back off a decline.
  const plainName = document.getElementById('name');
  const yesEl = document.getElementById('yes');
  plainName.addEventListener('input', () => { yesEl.disabled = plainName.value.trim().length < 2; });
  yesEl.onclick = () => answer('confirmed', null, plainName.value.trim());
  // "No" is a real decline (signed, terminal). Asking is its own, unsigned path.
  document.getElementById('no').onclick = () => declineFlow(d);
  document.getElementById('askp').onclick = () => askQuestion(d);
}

async function answer(action, note, name) {
  document.querySelectorAll('button').forEach((b) => (b.disabled = true));
  // Stop the reply poller BEFORE the round trip, not after it. Every branch below
  // replaces the whole screen, so from here on there is no `#thread` element for the
  // poller to update; and on the success path the document is terminal, where R5b
  // closes the thread and nothing further can arrive. A poll that fired in between
  // would be a request made on behalf of a page that no longer exists.
  window.dispatchEvent(new Event('ezjb:answered'));
  const { data, error } = await supabase.rpc('confirmation_respond', {
    p_token: token, p_action: action, p_note: note || null,
    p_user_agent: navigator.userAgent,   // an identity SIGNAL, not proof.
    p_signed_name: name || null,
  });

  if (error) {
    // The database refuses an unsigned priced approval (210_approval_signature.sql).
    // A normal reader cannot reach this — the button stays disabled until a name is
    // typed — so this is a direct RPC call or a broken client. Say what is missing
    // rather than "that didn't send", which would be the wrong reason.
    // Retired between opening the page and tapping. Rare, but it is exactly the
    // race the supersede rule exists to catch, so name it.
    if ((error.message || '').includes('replaced by a newer one') ||
        error.hint === 'link_superseded') {
      screen(`<div class="done"><div class="mark err">🔄</div>
        <h2>This version was replaced</h2>
        <p>The contractor sent an updated version while this page was open.
           Nothing was recorded. Please open the most recent link they texted you.</p></div>`);
      return;
    }
    const needsSignature =
      (error.message || '').includes('requires a typed signature') ||
      error.hint === 'signature_required';
    if (needsSignature) {
      screen(`<div class="done"><div class="mark err">✋</div>
        <h2>A name is required</h2>
        <p>Saying yes is a signature, so it has to be signed.
           Nothing was recorded. Open the link again and type your full name.</p>
        <div class="btns"><button class="yes" onclick="location.reload()">Open it again</button></div></div>`);
      return;
    }
    screen(`<div class="done"><div class="mark err">⚠️</div>
      <h2>That didn't send</h2>
      <p>Nothing was recorded. Please tap again.</p>
      <div class="btns"><button class="yes" onclick="location.reload()">Try again</button></div></div>`);
    return;
  }
  // A CONFIRMATION OVER THE DOCUMENT, NOT INSTEAD OF IT (hadar, 2026-08-10: "once a
  // change order is approved -- need popup not a whole page").
  //
  // It used to replace the entire page with a green tick on white. Two things were
  // wrong with that, and the second one matters more than the first:
  //   * The client had just signed something and the thing they signed vanished at
  //     the moment of signing. The one screen where "what did I just agree to?" is
  //     most likely to be asked was the one screen that could no longer answer it.
  //   * "You can close this page" is an instruction to leave, given to somebody whose
  //     next reasonable act is to re-read the terms or keep the record.
  // So the document stays on screen, dimmed, and the outcome arrives over it.
  if (data.status === 'already_answered') {
    outcomeModal('already', 'Already answered', 'Your first answer stands.');
    return;
  }
  outcomeModal(
    action === 'confirmed' ? 'approved' : 'declined',
    action === 'confirmed' ? (name ? `Approved — signed ${name}` : 'Approved') : 'Sent — do not proceed',
    action === 'confirmed'
      ? 'The contractor has your answer. This page stays here — you can re-read it or keep it for your records.'
      : 'The contractor has your answer.');
}

/**
 * The outcome, as a sheet over the document.
 *
 * NO "CLOSE THIS PAGE". The only control is Done, which dismisses the overlay and
 * leaves the client on the document they just signed. Nothing about the record
 * changes when it is dismissed — the answer is already committed server-side, and
 * this is an acknowledgement, not a step.
 *
 * The buttons underneath are disabled by `answer()` before the round trip, so the
 * document behind this is inert: dismissing the sheet cannot lead to a second
 * signature.
 */
function outcomeModal(kind, title, body) {
  const mark = kind === 'approved' ? '✓' : kind === 'declined' ? '✋' : '✓';
  const wrap = document.createElement('div');
  wrap.className = 'omwrap';
  wrap.innerHTML = `<div class="ombox" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="ommark ${esc(kind)}">${mark}</div>
      <h2 class="omh">${esc(title)}</h2>
      <p class="omp">${esc(body)}</p>
      <button class="approve omdone">Done</button>
    </div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.querySelector('.omdone').onclick = close;
  // The dim dismisses too — a sheet must never trap someone (the same rule the app's
  // own drawers follow). A tap INSIDE the box does not.
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  document.addEventListener('keydown', function esc2(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2); }
  });
  wrap.querySelector('.omdone').focus();
}

// NOTHING MAY LEAVE THIS PAGE ON "Loading…" FOREVER.
//
// `load()` used to be called bare. It is an async function, so anything it threw
// became an unhandled rejection: no screen, no console error, and a client left
// staring at a spinner with no way to tell whether the link was broken, the signal
// was bad, or they had done something wrong. That is exactly how the `.catch`
// outage above stayed invisible — the failure had a message and nowhere to put it.
//
// The recovery screen says the only two things a homeowner can act on: try again,
// or ask for the link again. It deliberately does NOT show the exception. A stack
// trace tells this reader nothing and looks like the app broke on them.
load().catch((e) => {
  // Kept for whoever is looking at a device with a console attached. It is the only
  // place the real reason survives.
  console.error('[confirm] load failed', e);
  screen(`<div class="done"><div class="mark err">⚠️</div>
    <h2>This didn't load</h2>
    <p>Something went wrong opening this. Nothing here was recorded.</p>
    <div class="btns"><button class="yes" onclick="location.reload()">Try again</button></div>
    <p class="recordnote">If it keeps happening, ask your contractor to text you the
      link again.</p></div>`);
});
</script>
</body>
</html>
