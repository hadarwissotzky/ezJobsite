<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approval</title>
<!--
  The no-login approval page — REQ-VAL1/2/3/8, and the client-facing REPORT.

  WHO IS READING THIS: a homeowner or a GC standing in a doorway, on their own
  phone, who has never heard of this app and will never make an account for it.
  They tapped a link a contractor texted them. If this page asks them to sign up,
  install anything, or work out what a "disposition" is, the contractor does not
  get their answer and the job stops. REQ-VAL3's no-login rule is not a
  convenience -- it is the only reason this loop closes at all.

  WHAT IT SHOWS (2026-07-20): for an EXTRA, the money is the report. The page now
  renders the priced approval -- who is asking, the scope, the FIXED PRICE, the
  running total already approved on the job, and a type-your-name-to-sign action.
  Every value is FROZEN at send (confirmation_fetch returns exactly what was
  stored): the price shown here is the price signed here. It cannot drift from the
  binding record, because the record is what it reads.

  WHY THIS IS A STATIC FILE IN A STORAGE BUCKET, and not an Edge Function:
  the page is inert. Every value it displays comes from confirmation_fetch(token),
  already granted to anon. There is no server logic to host.

  THE ANON KEY IS PUBLIC BY DESIGN. It identifies the project; RLS plus the RPC
  grants are what protect the data. anon can reach exactly two functions, no table.

  THE TOKEN IS THE CREDENTIAL. Whoever holds the link can answer. That is the trade
  REQ-VAL3 makes deliberately, stated plainly rather than dressed up.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* TOKENS RE-POINTED AT THE PORTAL DESIGN (hadar, 2026-08-10: "the element maybe
     there but they don't look as the design").
     Three things were wrong and all three were token-level, not layout:
       * GREEN. --approve was #0E8A4C, a bright signal green. The design uses a dark
         forest green as a TEXT and BUTTON colour — it reads as ink, not as a status
         light, which is what a document needs.
       * ORANGE. --orange carried the old kit's accent and painted a bright "APPROVAL
         REQUESTED" kicker the design does not have anywhere. It survives only for the
         one thing the design does colour: the count of what is owed.
       * RADIUS + LINE. 18px cards with #E4E5E1 borders read as app chrome. The design
         is a sheet of paper: ~11px corners and a hairline you have to look for. */
  :root {
    --ink:#191A17; --paper:#F7F6F3; --card:#FFFFFF;
    --orange:#C2410C;
    --steel:#6B6F6A; --line:#E7E6E1; --approve:#2F5233; --approveDeep:#26431F;
    --caution:#B26A00; --danger:#B3261E;
    --disp:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body:'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --r:11px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    margin: 0; padding: 0 0 40px; background: var(--paper); color: var(--ink);
    max-width: 480px; margin-inline: auto; min-height: 100vh;
  }
  .wrap { padding: 0 16px; }

  /* Branded header — who is asking + which job. */
  .brand { display: flex; align-items: center; gap: 12px; padding: 22px 16px 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--disp); font-weight: 700; font-size: 18px; letter-spacing: .5px; flex: none;
  }
  /* The real mark occupies the same slot as the initials tile. `contain`, not `cover`:
     a logo cropped to fill a square is a logo with its name cut off, and `#fff` behind it
     because most brand marks are drawn for white. */
  .logoimg { object-fit: contain; background: #fff; border: 1px solid var(--line); }
  .cn { font-family: var(--disp); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .3px; line-height: 1.1; }
  .cs { font-size: 13.5px; color: var(--steel); margin-top: 2px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px; margin-bottom: 10px;
  }
  /* Quiet. The design has no coloured kicker on the document; this is a label, and a
     bright one competes with the price for the first thing the eye lands on. */
  .kicker { font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--steel); }
  .title { overflow-wrap: anywhere; font-family: var(--disp); font-weight: 700; font-size: 26px; line-height: 1.12; text-transform: uppercase; letter-spacing: .3px; margin: 6px 0 0; }
  .scope { font-size: 16px; color: #26292e; margin-top: 10px; line-height: 1.55; }

  .price { display: flex; justify-content: space-between; align-items: baseline; }
  .pl { font-family: var(--disp); font-weight: 600; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; color: var(--steel); }
  .pv { font-family: var(--disp); font-weight: 700; font-size: 40px; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  /* The qualifier on an EWA cap ("max"). Sized down and kept on the same line as the
     figure: at .pv's 40px it wrapped, and a cap whose qualifier is orphaned reads for
     a moment as a fixed price. */
  .pvq { font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: .06em;
         text-transform: uppercase; color: var(--steel); margin-left: 6px; white-space: nowrap; }
  .clause { font-size: 13.5px; color: var(--steel); margin-top: 8px; line-height: 1.5; }
  .totals { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .trow { display: flex; justify-content: space-between; font-size: 14.5px; padding: 3px 0; color: var(--steel); }
  .trow b { color: var(--ink); font-family: var(--disp); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }

  /* PHOTOS — PRD R4. The evidence the client is being asked to believe.
     Two columns with the first tile spanning both: the opening shot of the walk is
     the one that says what this is about, and a uniform grid of thumbnails on a
     phone reads as decoration rather than as the thing you are approving.
     `aspect-ratio` + a filled background means every tile reserves its space BEFORE
     the bytes land, so the page does not reflow under the client's thumb while the
     images stream in on LTE — which on a slow link is how you get an accidental tap
     on a button that just moved. */
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
  .shot { position: relative; display: block; border-radius: 12px; overflow: hidden;
          background: #ECEDEA; aspect-ratio: 4 / 3; }
  .shot:first-child { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shotd { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px;
           font-size: 11.5px; color: #fff; letter-spacing: .02em;
           background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }

  /* Frozen legal wording, available but not shouting. */
  .exact { margin-top: 10px; }
  .exact summary { font-size: 13px; color: var(--steel); cursor: pointer; }
  .sow { white-space: pre-wrap; font-size: 15.5px; line-height: 1.55; color: #26292e; margin-top: 8px; }
  .fromline { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .terms { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .tline { font-size: 14px; line-height: 1.5; color: #26292e; margin-top: 4px; }
  .exact .doc { white-space: pre-wrap; background: #F3F4F2; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13.5px; line-height: 1.55; margin-top: 8px; color: #26292e; }

  /* Actions. Big, thumb-sized — answered one-handed, outdoors. */
  .sign { width: 100%; font-family: var(--body); font-size: 17px; padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); margin-bottom: 10px; }
  .sign:focus { outline: none; border-color: var(--ink); }
  /* SENTENCE CASE. The design's actions read as sentences a person says — "Approve
     $3,200", "Have a question?" — not as shouted labels. Condensed caps at 20px is a
     poster treatment and it made every control look equally loud. */
  button {
    font-family: var(--body); font-weight: 700; font-size: 17px; letter-spacing: 0;
    border: 0; border-radius: var(--r); padding: 16px; cursor: pointer; width: 100%; min-height: 56px;
  }
  .approve { background: var(--approveDeep); color: #fff; display: flex; align-items: center; justify-content: center; gap: 9px; }
  .ghost { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .approve:disabled { opacity: .4; }
  /* A BORDER, BECAUSE A CHOICE HAS TO LOOK LIKE ONE.
     `background: none` with no border rendered these as bare text under a large green
     button -- seen for the first time when the page was actually opened in a browser,
     2026-07-21. PRD R5 says approve / ask / decline are three distinct outcomes; on a
     phone this read as one button and two lines of footer copy. The client most likely
     to need "Ask a question instead" is the one least likely to recognise unbordered
     text as tappable, which is the core design test in CLAUDE.md: would someone who
     does not think in software succeed here without being taught?
     The card and the decline-confirmation button in this same file already carry
     `1px solid var(--line)`; these were simply missed. */
  .ghost {
    background: var(--card); color: var(--steel); font-size: 16px; margin-top: 10px;
    border: 1px solid var(--line);
  }
  .decline { background: none; color: var(--danger); border: 1.5px solid #E4C4C4; }
  .recordnote { font-size: 12px; color: var(--steel); text-align: center; margin-top: 12px; line-height: 1.5; }

  /* The "your question was sent" acknowledgement, at the top of the redrawn document.
     It replaces a full-screen terminal confirmation, so it has to carry the same
     weight without taking the page: a green rule and a filled background, above the
     fold, where the eye lands after a screen transition. Not a toast — a toast that
     fades is exactly the wrong shape for a client who looks up from the page and back
     down again ten seconds later. */
  .notice {
    background: #E8F5EE; border: 1px solid #BFE3CE; border-left: 4px solid var(--approve);
    border-radius: 12px; padding: 12px 14px; margin: 12px 0 0;
    font-size: 15px; line-height: 1.45; color: #14432B;
  }

  textarea { width: 100%; font-family: var(--body); font-size: 16px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); margin: 10px 0; min-height: 88px; resize: none; }

  /* ── THE CONVERSATION, AS A CONVERSATION (hadar, 2026-08-24: "missing the messaging
     section -- currently it is a different page, it needs to be on the same page") ──
     The thread was already rendered here, but the only way to WRITE into it was
     `askQuestion`, which called `screen()` and replaced the entire document with a
     bare textarea. So a homeowner composing a reply could not see the price they were
     asking about, could not see the contractor's last message, and could not see their
     own earlier question -- the three things anyone rereads before hitting send. It
     also meant every message cost a round trip out of the document and back.
     These styles exist so the thread can hold its own composer and read as a
     messenger: their words on the left, yours on the right, the box at the bottom. */
  .msgs { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .msg { max-width: 84%; min-width: 0; }
  .msg.me { align-self: flex-end; }
  .msg.them { align-self: flex-start; }
  /* `pre-wrap` is what keeps a client's line breaks. It also means ANY whitespace
     between this tag and the text inside it becomes visible indentation -- so the
     body is written flush against the tag, and the photo strip sits OUTSIDE. */
  .msgb { border-radius: 15px; padding: 10px 13px; font-size: 15.5px; line-height: 1.45;
          white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.them .msgb { background: #F1F0EB; border: 1px solid var(--line);
                    border-bottom-left-radius: 5px; color: #26292e; }
  .msg.me .msgb { background: var(--approveDeep); color: #fff; border-bottom-right-radius: 5px; }
  .msgm { font-size: 11.5px; color: var(--steel); margin: 5px 3px 0; }
  .msg.me .msgm { text-align: right; }
  /* The per-message mark. Orange is the one accent this page spends on "look here". */
  .msgnew { display: inline-block; margin-left: 6px; padding: 1px 6px 2px; border-radius: 999px;
            background: var(--orange); color: #fff; font-size: 10px; font-weight: 700;
            letter-spacing: .07em; text-transform: uppercase; }
  #thread { scroll-margin-top: 14px; }

  /* The composer. Deliberately quieter than Approve: this is the button somebody
     presses to ASK, and it must never look like the button that signs. */
  .comp { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
  .comp textarea { min-height: 64px; margin: 0; }
  .complab { display: block; font-size: 13px; font-weight: 600; color: var(--steel);
             margin-bottom: 7px; }
  .compr { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
  .comphint { flex: 1; font-size: 12px; color: var(--steel); line-height: 1.4; }
  .compsend { width: auto; flex: none; min-height: 44px; padding: 11px 22px; font-size: 15.5px;
              background: var(--approveDeep); color: #fff; }
  .compsend:disabled { opacity: .35; }
  .comperr { color: var(--danger); font-size: 13.5px; margin: 9px 0 0; }

  /* "You have unread messages", at the top of the page, on open.
     The client has no account and no notification of any kind, so the ONLY moment
     this product can tell them a reply is waiting is the moment they open the link.
     A banner, not a toast: a toast that fades is exactly wrong for a reader who looks
     up from the page and back down again ten seconds later. */
  .newwrap { padding: 12px 16px 0; }
  .newbar { display: flex; align-items: center; gap: 12px; text-decoration: none;
            background: #FFF4EC; border: 1px solid #F3CDB2; border-left: 4px solid var(--orange);
            border-radius: 12px; padding: 12px 14px; color: var(--ink); }
  .newn { flex: none; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
          background: var(--orange); color: #fff; font-weight: 700; font-size: 14px;
          display: flex; align-items: center; justify-content: center; }
  .newt { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .newsub { display: block; font-size: 13px; font-weight: 400; color: var(--steel); margin-top: 2px; }
  @media (min-width: 940px) {
    .newwrap { max-width: 1320px; margin-inline: auto; padding: 20px 24px 0; }
  }

  /* Legacy plain-confirm fallback (no price). */
  .plaincard { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-size: 16.5px; line-height: 1.6; }
  h1.plain { font-size: 21px; margin: 4px 0 16px; line-height: 1.3; }
  .who { font-size: 14px; color: var(--steel); margin-bottom: 4px; }
  .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .yes { background: var(--approve); color: #fff; }
  .no { background: none; color: var(--danger); border: 1.5px solid #E4C4C4; }

  /* Terminal screens. */
  .done { text-align: center; padding: 46px 22px; }
  .done .mark { font-size: 52px; line-height: 1; }
  .done h2 { font-family: var(--disp); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; font-size: 26px; margin: 16px 0 8px; }
  .done p { color: var(--steel); font-size: 15.5px; line-height: 1.55; margin: 0; }
  .err { color: var(--danger); }

  /* ── DESKTOP (hadar's portal design, 2026-08-09) ────────────────────────────────
     The phone layout above is untouched and stays the default: this page is opened
     from an SMS, so a phone is the common case and the wide layout is the addition,
     not the baseline. Everything below only applies once there is room for it.

     One shell, two columns. The sidebar is a NAVIGATION surface — the project, the
     other change orders, how to reach a human — and the document keeps the whole
     right column so the thing being signed is never squeezed by chrome. */
  .shell { display: block; }
  .side { display: none; }

  @media (min-width: 940px) {
    body { max-width: none; padding-bottom: 0; }
    .shell {
      display: grid; grid-template-columns: 300px minmax(0, 1fr);
      align-items: start; gap: 24px;
      max-width: 1320px; margin-inline: auto; padding: 24px;
    }
    /* Sticky, and scrollable on its own: on a job with fifteen change orders the
       list must not push the "Questions?" card past the bottom of a laptop screen. */
    .side {
      display: block; position: sticky; top: 24px;
      max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .main { min-width: 0; }
    .wrap { padding: 0; }
    /* The document reads as one sheet on a desk, not as a stack of phone cards. */
    .main .card { border-radius: 14px; }
    .main .title { font-size: 34px; }
    .main .pv { font-size: 46px; }
    .shots { grid-template-columns: 1fr 1fr 1fr; }
    .shot:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
    /* Actions sit side by side once there is width: approve is the act, asking is
       the alternative, and stacking them full-width on a 1200px screen makes the
       second one look like a second primary. */
    .acts { display: flex; gap: 12px; }
    .acts .approve { flex: 1.6; }
    .acts .ghost { flex: 1; margin-top: 0; }
  }

  /* ── the sidebar ───────────────────────────────────────────────────────────── */
  .sbrand { display: flex; align-items: center; gap: 11px; padding: 2px 4px 16px; }
  .sbc { font-family: var(--body); font-weight: 700; font-size: 17px; line-height: 1.12;
         text-transform: uppercase; letter-spacing: .2px; }
  .sbt { font-size: 12.5px; color: var(--steel); margin-top: 3px; }
  .phero { display: block; width: 100%; height: 132px; object-fit: cover;
           border-radius: 10px; margin: 4px 0 10px; background: #ECEDEA; }
  .slink { display: inline-block; margin: 10px 4px 2px; font-weight: 600; font-size: 14.5px;
           color: var(--approve); text-decoration: none; }
  .saskrow { display: flex; gap: 11px; align-items: flex-start; margin-top: 8px; }
  .sasbtn { min-height: 46px; font-size: 14.5px; margin-top: 12px; }
  /* The exclusions carry a mark of their own — the one section a reader skims and the
     one whose absence costs money later. */
  .secico { position: relative; }
  .secdot { position: absolute; top: -1px; right: -1px; width: 9px; height: 9px;
            border-radius: 5px; background: #E08A00; border: 2px solid var(--card); }
  .sfoot { display: flex; align-items: flex-start; gap: 7px; }

  .sh { font-family: var(--body); font-weight: 700; font-size: 19px; margin: 16px 4px 8px;
        padding-top: 16px; border-top: 1px solid var(--line); letter-spacing: -.2px; }
  .sh:first-of-type { border-top: 0; padding-top: 0; }
  .sproj { font-family: var(--body); font-weight: 700; font-size: 17px; margin: 2px 4px 2px; }
  .saddr { font-size: 13.5px; color: var(--steel); margin: 0 4px; line-height: 1.45; }
  /* Two counts, side by side. The one that needs an answer carries the caution
     colour; the settled one stays neutral — colour marks what is OWED, nothing else. */
  .scounts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .scount { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
  .scount.need { border-color: #F0D6A6; background: #FFFBF2; }
  .scl { font-size: 12.5px; line-height: 1.25; color: var(--steel); }
  .scount.need .scl { color: var(--orange); }
  .scv { font-family: var(--body); font-weight: 700; font-size: 27px; line-height: 1.1; margin-top: 4px;
         color: var(--approve); }
  .scount.need .scv { color: var(--orange); }
  .slab { font-family: var(--body); font-weight: 600; font-size: 11.5px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--steel); margin: 16px 4px 6px; }
  .srow { display: flex; gap: 8px; align-items: flex-start; text-decoration: none; color: inherit;
          border: 1px solid var(--line); border-radius: 12px; background: var(--card);
          padding: 10px 12px; margin-bottom: 6px; }
  .srow.here { border-color: var(--ink); background: #F3F4F2; }
  .srt { font-size: 14.5px; line-height: 1.3; }
  .srt b { font-weight: 700; }
  .srm { font-size: 12.5px; color: var(--steel); margin-top: 3px; }
  .sra { font-family: var(--body); font-weight: 700; font-size: 14.5px; margin-left: auto;
         white-space: nowrap; font-variant-numeric: tabular-nums; }
  .srtick { color: var(--approve); flex: none; }
  .sask { border: 1px solid var(--line); border-radius: 14px; background: var(--card);
          padding: 14px; margin-top: 18px; }
  .saskh { font-family: var(--body); font-weight: 700; font-size: 16px; }
  .saskt { font-size: 13.5px; color: var(--steel); margin-top: 4px; line-height: 1.45; }
  .sfoot { font-size: 12px; color: var(--steel); margin: 18px 4px 4px; }

  /* ── the document's identity line ──────────────────────────────────────────── */
  .idn { font-family: var(--body); font-weight: 700; font-size: 17px; text-transform: uppercase;
         letter-spacing: .3px; color: var(--approve); }
  .idm { font-size: 13.5px; color: var(--steel); margin-top: 3px; }

  /* ── contract summary ─────────────────────────────────────────────────────── */
  .csum { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14.5px; }
  .csum td { border: 1px solid var(--line); padding: 9px 12px; }
  .csum td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .csum tr.this td { background: #F3F4F2; font-weight: 600; }
  .csum tr.tot td { font-weight: 700; }
  .csumnote { font-size: 12.5px; color: var(--steel); margin-top: 8px; line-height: 1.45; }
  /* The cost grid reuses .csum entirely -- same table, same rules, same right-aligned
     tabular money column -- so the breakdown and the contract summary read as one
     family instead of two invented tables. Only the quantity sub-label is new. */
  .cbqty { display: block; font-size: 12.5px; color: var(--steel); margin-top: 2px; }

  .allshots { display: flex; align-items: center; justify-content: center; gap: 8px;
              margin-top: 8px; min-height: 46px; border: 1px solid var(--line);
              border-radius: var(--r); color: var(--ink); text-decoration: none;
              font-weight: 600; font-size: 14.5px; background: var(--card); }
  .demobar { background: #FDF3DC; border: 1px solid #EFDCA9; border-radius: var(--r);
             padding: 10px 14px; font-size: 13.5px; color: #7A5A11; margin-bottom: 10px; }

  /* ── the approved stamp ────────────────────────────────────────────────────── */
  .stamp { display: flex; gap: 13px; align-items: flex-start; border: 1px solid;

  .bandtitle { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }

  @media (min-width: 940px) {

  .lhpc { font-size: 14px; margin-top: 3px; }

  @media (min-width: 940px) {
    /* THE SHEET HAS ONE COLUMN LINE. Every band that splits — letterhead, job, title,

  .wch { font-family: var(--disp); font-weight: 600; font-size: 12.5px; letter-spacing: .12em;

  .pbar { display: flex; align-items: center; gap: 11px; padding: 18px 16px 12px; }

  .backbar { padding: 14px 16px 0; }

  .tabs {

    .exact { display: block; }
    .exact[open] .doc, .exact .doc { background: #fff; }
  }

<!-- PRD R3 AC2. A SEPARATE FILE on purpose: this page renders a PRICED approval —
     a big number, a running total, and "Nothing proceeds until you approve." All
     three are wrong for an Extra Work Authorization, which has no price, and on a
     T&M-capped term work proceeds precisely BECAUSE it was approved. A classic
     script runs before any module, so window.renderEwa is set by the time the
     dispatch below needs it. -->
<script src="ewa.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Injected at deploy time. The anon key is public by design (see the top comment).
const SUPABASE_URL = '__SUPABASE_URL__';
const ANON_KEY = '__ANON_KEY__';

const supabase = createClient(SUPABASE_URL, ANON_KEY);
const root = document.getElementById('root');
// The link may arrive either way: ?t=TOKEN (works on any static host with no
// rewrite) or a pretty /c/TOKEN path (needs a host rewrite). Accept both so the
// choice of host never silently breaks every link.
const token = new URLSearchParams(location.search).get('t')
  || (location.pathname.match(/\/c\/([^/?#]+)/) || [])[1] || null;
// Which VIEW of the same link. `v=project` is the phone's list screen; anything else
// (including nothing) is the document. One URL, one credential — see projectHtml.
const view = new URLSearchParams(location.search).get('v');
/**
 * Design-preview flag — AND IT MUST NEVER APPLY TO A REAL DOCUMENT.
 *
 * `?demo=1` invents a company name, address, phone, email, a named contact and a CO
 * number so the letterhead can be reviewed while those fields are still empty in the
 * product. It was gated on the query string ALONE, which meant anyone holding a genuine
 * approval link could append it and be shown a document whose letterhead, requesting
 * party and change-order number differ from the frozen `shown_content` they are being
 * asked to sign — with Approve and Decline still live. That is precisely the invariant
 * this page exists to hold (mandate #5: what the signer saw is the binding instrument).
 *
 * So it now additionally requires that there be NO TOKEN: the preview is for the
 * design, and a design has no counterparty. With a token present the flag is ignored
 * and the page draws only what the server sent. Found by review, 2026-08-13.
 */
// `token`, not `?t=` — the link may also arrive as a /c/TOKEN path, and a gate that
// only knew one of the two would still fabricate letterhead on half the real links.
const demo = new URLSearchParams(location.search).get('demo') === '1' && !token;

// The EWA's structured terms, held at module scope so a redraw (Back, or the return
// from the question screen) does not need to re-fetch them and cannot redraw the
// authorization without them. `renderEwa` fails closed on null, which is the correct
// outcome if they were never fetched — an authorization missing its proceed term must
// not be signable.
let ewaTerms = null;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

 * THE PORTAL'S OWN WORDS, in the language the instrument was sent in (LANGUAGE-LAYER
 * slice 2 — the server stores `lang` on the confirmation since sql/443).
 *
 * `shown_content` arrives already written in that language; these are the words AROUND
 * it — the Approve button, the signature ask, the composer. A Spanish document under
 * English buttons is a half-translated page shown to the one reader who never chose
 * this product, so the chrome follows the document, not the browser: the sender knows
 * his client; navigator.language knows a device.
 *
 * DELIBERATELY NOT EXHAUSTIVE. Everything a client must READ OR ACT ON is here; deep
 * secondary chrome (running-total summaries, photo captions) still reads English and is
 * listed as known-incomplete in the commit that added this. Adding a string here means
 * adding it to BOTH languages — a missing key falls back to English, never to blank.
 */
const PORTAL_LANG = { current: 'en' };
const PL_STRINGS = {
  en: {
    approve: (amt) => `Approve ${amt}`,
    decline: 'Decline — do not proceed',
    approvalBand: 'Approval',
    authorise: (co) => `By approving this change order, you authorise ${co} to carry out the additional work described above, for the amount and schedule impact stated. This becomes part of the contract.`,

    schedBand: 'Schedule impact',
    termsBand: 'Terms',

    messageCo: (co) => `Message ${co}`,
    composerPlaceholder: 'What would you like to ask or change?',
    sendingApprovesNothing: 'Sending approves nothing.',
    send: 'Send',
    sending: 'Sending…',
    approved: 'Approved',
    declinedStamp: 'Declined — do not proceed',
    declined: 'Declined',
    signedBy: (name) => ` — signed ${name}`,
    translatedNote: 'Translated — the original is kept',
  },
  es: {

    decline: 'Rechazar — no proceder',
    approvalBand: 'Aprobación',
    authorise: (co) => `Al aprobar esta orden de cambio, usted autoriza a ${co} a realizar el trabajo adicional descrito arriba, por el monto y el impacto en el cronograma indicados. Esto pasa a formar parte del contrato.`,
    signLabel: 'Escriba su nombre completo para firmar',
    signPlaceholder: 'Su nombre completo',
    schedBand: 'Impacto en el cronograma',
    termsBand: 'Condiciones',
    questions: '¿Preguntas?',
    writeBack: 'Responder',
    messageCo: (co) => `Escribir a ${co}`,
    composerPlaceholder: '¿Qué le gustaría preguntar o cambiar?',
    sendingApprovesNothing: 'Enviar un mensaje no aprueba nada.',
    send: 'Enviar',
    sending: 'Enviando…',
    approved: 'Aprobado',
    declinedStamp: 'Rechazado — no proceder',
    declined: 'Rechazado',
    signedBy: (name) => ` — firmado ${name}`,
    translatedNote: 'Traducido — se conserva el original',
  },
};
const PL = new Proxy({}, { get: (_, k) =>
  (PL_STRINGS[PORTAL_LANG.current] ?? PL_STRINGS.en)[k] ?? PL_STRINGS.en[k] });


// Integer cents -> "$1,850". Money never becomes a float here either.
const usd = (cents) => {
  if (cents == null) return '';
  const s = Math.abs(cents).toString().padStart(3, '0');
  const whole = s.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '$' + whole + '.' + s.slice(-2);
};
// Initials for the logo tile, from the company name.
const initials = (name) => String(name || '')
  .split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '•';

/**
 * THE LOGO TILE — the real mark when we have one, initials when we do not.
 *
 * hadar, 2026-08-18: he had uploaded a logo and could not tell whether it was doing
 * anything. It was saving; this page was drawing two letters in a grey box on the
 * document a homeowner is asked to authorise money on.
 *
 * ONE HELPER, THREE CALLERS. The tile appears in the project bar, the desktop sidebar and
 * the letterhead card, and before this they were three copies of the same expression. A
 * fourth reader would have found two of them updated.
 *
 * `logoUrl` is minted per page load by the `letterhead` function (the object is private
 * and this page is anon, so it cannot sign one itself). It is null whenever anything at
 * all went wrong — no logo set, an expired token, a storage hiccup — and null always
 * means INITIALS, never an empty box. A missing picture must never cost a homeowner the
 * document.
 *
 * `onerror` is not belt-and-braces: the URL expires in an hour, and a page left open on a
 * kitchen counter overnight would otherwise show a broken-image glyph where the
 * contractor's identity belongs. It falls back to the same initials tile.
 */
const logoTile = (name, logoUrl) => {
  const ini = esc(initials(name || '?'));
  if (!logoUrl) return `<div class="logo">${ini}</div>`;
  return `<img class="logo logoimg" src="${esc(logoUrl)}" alt="${esc(name || '')}"`
    + ` onerror="this.outerHTML='&lt;div class=&quot;logo&quot;&gt;${ini}&lt;/div&gt;'">`;
};

function screen(html) { root.innerHTML = html; }
function done(mark, title, sub) {
  screen(`<div class="done"><div class="mark">${mark}</div>
    <h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`);
}

async function load() {
  if (!token) { done('⚠️', 'This link is incomplete', 'Ask for the link again.'); return; }

  // Both reads go out together. They share only the token and neither needs the
  // other's answer, so awaiting them in series just made the client wait two round
  // trips before seeing anything — on the bad-signal phone this page is built for,
  // that is the whole perceived load time, doubled, for no reason.
  //
  // A link is retired the moment a newer one is issued for the same change order
  // (250_one_live_link), so an old text message can no longer be signed at a stale
  // price. Say that here rather than letting the client read, type their name and
  // only THEN hit a refusal. Checked separately because confirmation_fetch is one of
  // the four already-duplicated functions and extending it would add a fifth.
  //
  // PRD R4's photos ride along as a THIRD parallel call, not a fourth field on
  // confirmation_fetch. Two reasons, and the second is the one that matters:
  //   * confirmation_fetch is owned by 200_priced_approval.sql and has already been
  //     redefined across files once, at real cost. 304_approval_photos.sql owns this
  //     one and nothing else touches it.
  //   * it is inside the SAME Promise.all, so it costs ZERO extra round trips against
  //     the AC's 3 seconds. The photos themselves are what has to fit in that budget,
  //     not the question of whether there are any.
  //
  // 399 rides along in the same Promise.all for the same reason: zero extra round
  // trips against the 3-second budget. Both are OPTIONAL — on a server where 399 has
  // not been applied the RPC does not exist and the call errors, which must degrade
  // to "no sidebar, no identity line" and never to a blank page. That is the exact
  // failure this file already shipped once (an unpinned import took the whole page
  // down silently), so every new call is written to fail into a lesser page.
  const [{ data, error }, { data: st }, ph, proj, hdr, chg, cmp, lgo] = await Promise.all([
    supabase.rpc('confirmation_fetch', { p_token: token }),
    supabase.rpc('confirmation_state', { p_token: token }),
    supabase.rpc('confirmation_photos', { p_token: token }),
    supabase.rpc('confirmation_project_v1', { p_token: token }),
    supabase.rpc('confirmation_header_v1', { p_token: token }),
    supabase.rpc('confirmation_changes_v1', { p_token: token }),
    supabase.rpc('confirmation_company_v1', { p_token: token }),
    // THE LETTERHEAD LOGO. A function and not an RPC because the object is private and
    // this page is anon — Postgres cannot sign a Storage URL, so the key `company_v1`
    // has returned since 402 was never renderable here.
    //
    // In the SAME Promise.all as everything else, deliberately: sequencing it after the
    // document would add a round-trip to the 3-second budget for a picture. Its rejection
    // is caught HERE rather than by the outer try, because every other call in this list
    // is allowed to fail into a lesser page and a logo must not be the one exception that
    // blanks it.
    supabase.functions.invoke('letterhead', { body: { token } }).catch(() => null),
  ]);
  if (error) { done('⚠️', 'Could not load this', 'Check your connection and open the link again.'); return; }

  /**
   * THE PAGE SPEAKS THE DOCUMENT'S LANGUAGE (slice 2, sql/443). Set once, before any
   * render runs, from the language the SENDER chose — not navigator.language, which
   * knows the device and not the reader. Rows sent before 443 carry null and read as
   * English, which is what they were.
   */
  if (data?.lang && PL_STRINGS[data.lang]) {
    PORTAL_LANG.current = data.lang;
    document.documentElement.lang = data.lang;
  }

  /**
   * WITHDRAWN — checked BEFORE superseded, and that order is the whole point (421).
   *
   * A cancelled link is also retired, so it would otherwise fall into the branch below
   * and be told "this version was replaced", with a forward link that does not exist.
   * Nothing replaced it: the contractor withdrew the request. Telling a client the wrong
   * one of those sends them hunting through their messages for a newer text that was
   * never sent.
   *
   * It offers NO action and no link. There is nothing for them to approve, nothing owed,
   * and the last line says so — that is the question a person actually has when a
   * request they were considering disappears.
   */
  if (st && st.found && st.cancelled && !st.answered) {
    done('—', 'This was withdrawn',
      'Your contractor withdrew this change order. There is nothing to approve, nothing has been agreed, and you will not be charged for it. If you think this is a mistake, contact them directly.');
    return;
  }

  if (st && st.found && st.superseded && !st.answered) {
    // R6 AC2: LINK to the current version, do not describe it. This used to say
    // "please open the most recent link they texted you", which asks a homeowner
    // standing in a doorway to go hunting through their SMS history and diff two
    // near-identical URLs by eye. The live token was in the database the whole time.
    //
    // The URL is built from THIS page's own origin, never from a base stored
    // server-side: a second source of truth for where this page lives has already
    // been wrong once (EXPO_PUBLIC_CONFIRM_BASE pointed at a domain that did not
    // exist). Whatever host served this link serves the next one.
    //
    // live_token is null when a link was retired with no replacement — the
    // contractor changed his mind. That is a real state and it keeps the old copy,
    // because sending someone to a page that does not exist is worse than telling
    // them to ask.
    const live = st.live_token
      ? `${location.pathname}?t=${encodeURIComponent(st.live_token)}`
      : null;
    screen(`<div class="done"><div class="mark">🔄</div>
      <h2>This version was replaced</h2>
      <p>${live
        ? 'The contractor sent an updated version. Nothing here was recorded.'
        : 'The contractor withdrew this request. Nothing here was recorded — ask them for a new link.'}</p>
      ${live ? `<div class="btns"><a class="yes" style="display:block;text-decoration:none;text-align:center"
           href="${esc(live)}">Open the current version</a></div>` : ''}
      </div>`);
    return;
  }

  // R6 AC: "opened twice and questioned once -> the timeline shows each event."
  // Logged HERE, after the fetch succeeded and BEFORE any branch, so an open counts
  // whether they approve, ask, decline, or just read it and put the phone down —
  // "she opened it three times and has not answered" is the signal that tells a
  // contractor whether to chase, and it is only true if every open is counted.
  //
  // Fire-and-forget on purpose. This is bookkeeping about the page, and it must
  // never delay or block what the client came here to do. The RPC no-ops on an
  // unknown token rather than erroring, so a bad link still shows "not valid"
  // instead of a network failure.
  //
  // ── `Promise.resolve(...)` IS LOAD-BEARING. IT IS THE FIX FOR A TOTAL OUTAGE ──
  // This line read `supabase.rpc(...).catch(...)`. What `rpc()` returns is a
  // PostgrestFilterBuilder — a THENABLE, not a Promise. It has `.then()`; it does not
  // have `.catch()`. So the line threw `supabase.rpc(...).catch is not a function`
  // SYNCHRONOUSLY, inside `load()`, which is called at the bottom of this module with
  // no error handling — and an async function that throws returns a rejected promise
  // nobody is listening to.
  //
  // The consequence: EVERY approval link, of every kind, stopped at "Loading…" and
  // never rendered anything. No error on screen, nothing in the console (an unhandled
  // rejection is not a console error), and the three RPCs above visibly succeeded in
  // the network tab — so the page looked like a slow server rather than a dead one.
  // Reproduced against the live database and the token in `confirmation_request` on
  // 2026-08-06, on the page as committed, before any change in this pass.
  //
  // The version drift that caused it is the second half of the lesson, recorded
  // because the fix does not remove it: this page imports
  // `https://esm.sh/@supabase/supabase-js@2` — an UNPINNED major range, resolved at
  // page load, off a CDN. The builder used to extend Promise; it no longer does. So a
  // patch release on someone else's server disabled the entire client-facing half of
  // this product with no deploy, no commit and no signal. See docs/CLIENT-PORTAL.md
  // §"Open questions" — pinning is a decision, not a cleanup.
  //
  // `Promise.resolve(thenable)` adopts it and gives back a real Promise, so this is
  // correct against both the old shape and the new one.
  Promise.resolve(
    supabase.rpc('confirmation_opened', { p_token: token, p_user_agent: navigator.userAgent })
  ).catch(() => { /* 366 not applied yet, or offline. The page is unaffected. */ });

  if (data.status === 'not_found') { done('⚠️', 'This link is not valid', 'It may have been mistyped. Ask for a new one.'); return; }
  if (data.status === 'expired') { done('⏰', 'This link has expired', 'Ask for a new one — nothing is lost.'); return; }
  /*
   * WITHDRAWN — say it plainly, and never render the document [2026-08-25].
   *
   * Before this, `cancelled_at` was invisible here: the page drew a live change order
   * with a working Approve button, and the refusal only arrived from a database trigger
   * AFTER the client had typed their full name to sign it. The document was already
   * taken back; the only honest thing this page can do is say so.
   *
   * It names the change order and the contractor so the client knows WHICH one was
   * withdrawn — they may be holding several links — and it does not offer a way to
   * approve anything. "Ask for a new one" is deliberately absent: nothing is waiting on
   * the client here, and telling them to chase it would be wrong.
   */
  if (data.status === 'cancelled') {
    // NOT pre-escaped: `done` escapes its arguments, and escaping twice would render
    // an ampersand in a company name as "&amp;amp;" on the one page that has to look
    // like it came from a real business.
    var whoBy = data.company_name || 'The contractor';
    done('↩︎', 'This change order was withdrawn',
      whoBy + ' took ' + (data.scope_title ? '“' + data.scope_title + '” ' : 'this ')
      + 'back, so there is nothing to approve. Nothing is owed and nothing proceeds.');
    return;
  }

  // Photos are OPTIONAL and their absence is never an error. On a database where
  // 304_approval_photos.sql has not been applied the RPC does not exist and `ph.error`
  // is set — the approval must still render and still be signable. An extra with no
  // photos is a legal extra (PRD R4 says "0-8"), so the two cases collapse to the
  // same empty list rather than to a failure screen.
  data.photos = (ph && ph.data && Array.isArray(ph.data.photos)) ? ph.data.photos : [];
  // Same tolerance as the photos line above, and for the same reason: an
  // unmigrated server, an empty result and a token that is not live are all
  // "no project view", and the page must render identically for all three.
  data.__project = (proj && proj.data && proj.data.project_id) ? proj.data : null;
  data.__header = (hdr && hdr.data) ? hdr.data : {};
  // Null unless this version REPLACED one. `revised:false` (a first issue) and an
  // unmigrated server both collapse to null, and the banner simply does not render —
  // an "updated" notice on an original would be a lie on the page where trust IS the
  // product.
  data.__changes = (chg && chg.data && chg.data.revised) ? chg.data : null;
  data.__company = (cmp && cmp.data && cmp.data.company) ? cmp.data.company : null;
  // Same tolerance as every optional call above: a function that is not deployed, a
  // company with no logo, an expired signature and a network blip all collapse to null,
  // and null renders the initials tile. `logoTile` is the only reader.
  data.__logoUrl = (lgo && lgo.data && lgo.data.logoUrl) ? lgo.data.logoUrl : null;
  data.__contact = (cmp && cmp.data && cmp.data.contact) ? cmp.data.contact : null;
  applyDemo(data);

  // THE CONVERSATION IS FETCHED BEFORE ANY BRANCH (DEF-5).
  //
  // It used to be fetched between the EWA dispatch and the priced render, which meant
  // exactly two of the three documents this page can draw ever had a thread:
  //   * an EWA returned at the `kind === 'ewa'` dispatch, above the fetch, so an owner
  //     holding an authorization link could not see a single message either side had
  //     written about it;
  //   * an ANSWERED link returned even earlier, so the moment a client signed, the
  //     discussion that led to the signature disappeared from the only copy they have.
  // Both are REQ-LC33 — "Stage 3 is readable forever, BY BOTH PARTIES, at the same
  // address" — and the party with the least access and the most at stake is the one
  // who signed. So the fetch is hoisted above every branch that renders a document,
  // and each of them renders it.
  //
  // confirmation_thread (308) supersedes confirmation_questions (220): it returns the
  // contractor's replies too and walks the revision lineage, so a conversation
  // survives a Revise & Resend instead of restarting at the new link.
  await loadThread(data);

  // THE WATERMARK IS READ ONCE, HERE, BEFORE A SINGLE MESSAGE IS DRAWN.
  //
  // Everything downstream compares against this number, so "new" means "new when you
  // opened the page" and stays stable for the whole visit. Reading it per-render
  // instead would let the mark-as-read observer un-mark a reply while the client was
  // still looking at it.
  data.__seenAt = seenMark();

  // ANSWERED IS THE SAME DOCUMENT (hadar, 2026-08-10: "why the approved change order
  // looks different?").
  //
  // It rendered its own screen — a tick, a line of text and the raw frozen wording in
  // a grey box — because it predates the document renderer and nobody joined them up.
  // So the moment a client signed, the page they had been reading was replaced by a
  // different-looking page about the same thing: no letterhead, no sections, no
  // photographs beside them, no summary. The party with the most at stake got the
  // worst copy, which is precisely backwards.
  //
  // There is ONE document now. `renderPriced` draws it whether it is open or
  // answered; the status band at the top and the action band at the bottom are what
  // change. Everything the old branch was right about is kept — the frozen wording,
  // the photographs and the discussion all stay at this address forever, because
  // dropping any of them would leave the signer holding less evidence than the party
  // they signed with.
  //
  // The plain (unpriced) path keeps its own renderer and is passed the same flag.
  if (data.status === 'already_answered') {
    if (data.kind === 'ewa') { /* fall through to the EWA renderer below */ }
    // `afterDocumentRender` here for the same reason it exists at all: an answered
    // document draws no composer, but it still draws the conversation, and a reply
    // that landed before the client signed is still one they may never have read.
    else if (data.amount_cents != null) { renderPriced(data, null); afterDocumentRender(data); return; }
    else { renderPlain(data, null); afterDocumentRender(data); return; }
  }

  // THE PHONE'S LIST SCREEN, off the same token. Placed AFTER the superseded and
  // already-answered branches on purpose: those two say something urgent and specific
  // about THIS link, and a client who followed a stale link deserves to be told so
  // rather than dropped on a project index that silently omits the document they were
  // looking for. `data.__project` is null unless the token is live, so a stale link
  // cannot reach this anyway — the ordering makes the message better, not the gate.
  if (view === 'project' && data.__project) {
    document.body.classList.add('hastabs');
    screen(projectHtml(data) + tabsHtml(data, 'project'));
    // The list screen has no thread of its own — the conversation belongs to the
    // document, and duplicating it here would be two copies of one record at two
    // addresses. `askQuestion` sends them to the one that exists.
    const ask = document.getElementById('askfromproject');
    if (ask) ask.onclick = () => askQuestion();
    // The badge still belongs here: this is the tab bar, and a client who lands on
    // the project list must be able to see that somebody answered them.
    updateUnseenChrome(data);
    return;
  }

  // R3 AC2: an EWA is a DIFFERENT INSTRUMENT and gets a different page. Dispatch on
  // `kind`, which confirmation_fetch already returns, NOT on the absence of a price:
  // "no amount_cents" is also true of a legacy decision-confirm, and rendering an
  // authorization as one of those would drop the proceed term and the settlement
  // window — the two clauses that decide whether work starts today.
  if (data.kind === 'ewa') {
    // Terms live in their own table (303) and are frozen alongside shown_content.
    // A fetch failure leaves them null, and renderEwa refuses to render an incomplete
    // authorization rather than showing a signable page with clauses missing.
    try {
      const { data: t } = await supabase.rpc('ewa_terms_fetch', { p_token: token });
      ewaTerms = t ?? null;
    } catch { ewaTerms = null; }
  }

  renderDocument(data);
  watchForReplies(data);
}

/**
 * Fetch the conversation onto `d.__thread`.
 *
 * Separated from `load()` so the same call serves three moments: the first render,
 * the return trip after the client asks something, and the poll that notices the
 * contractor answered. One fetch, one shape, no second parser.
 *
 * A failure leaves the PREVIOUS thread in place rather than blanking it. Losing
 * signal mid-poll must never make a client's own question disappear off the page
 * they are looking at — that reads as "it did not send".
 */
async function loadThread(d) {
  try {
    const { data: th } = await supabase.rpc('confirmation_thread', { p_token: token });
    if (Array.isArray(th)) d.__thread = th;
    else if (!Array.isArray(d.__thread)) d.__thread = [];
    /**
     * THE CONTRACTOR'S REPLIES, IN THE DOCUMENT'S LANGUAGE (slice 3). He writes in his
     * language; this page was sent in the client's. Only HIS side is translated — the
     * client's own words need no help — and `body` is never replaced: `display` rides
     * beside it, and the bubble marks itself translated. Best-effort: offline or
     * function-down, the original renders, exactly as this page always did.
     */
    /**
     * ALWAYS toward the document's language — including English. Scenario 1 is a
     * Spanish-speaking contractor sending an ENGLISH document: his replies arrive in
     * Spanish and the client must read them in English, so 'en' is a target like any
     * other. translate-v1 returns already-English text unchanged and caches it, so
     * the steady cost of the common case is one lookup.
     */
    if (Array.isArray(d.__thread)) {
      const texts = [...new Set(d.__thread
        .filter((m) => m.side !== 'client' && m.body && m.body !== '📷')
        .map((m) => m.body))];
      if (texts.length) {
        try {
          const { data: tr } = await supabase.functions.invoke('translate-v1', {
            body: { texts, target: PORTAL_LANG.current, token },
          });
          if (tr?.ok && Array.isArray(tr.texts)) {
            const map = new Map(texts.map((t, i) => [t, tr.texts[i]]));
            for (const m of d.__thread) {
              const got = map.get(m.body);
              if (m.side !== 'client' && typeof got === 'string' && got.trim()) m.__display = got;
            }
          }
        } catch { /* originals render */ }
      }
    }
  } catch { if (!Array.isArray(d.__thread)) d.__thread = []; }
  return d.__thread;
}

/**
 * Draw whichever document this token carries.
 *
 * ONE dispatch, called from three places — the first load, the return from the
 * question screen, and the Back buttons — because there used to be three copies of
 * `d.amount_cents != null ? renderPriced : renderPlain` and none of them knew about
 * the EWA branch, which lived only inside `load()`. An EWA that reached a Back button
 * was therefore redrawn as a priced approval with no price: the proceed term and the
 * settlement window silently gone from a page still offering a signature.
 *
 * `notice` is a one-line banner ("Your question was sent"), rendered by the document
 * renderers above the thread. It is a parameter and not state, so it appears once and
 * does not survive a reload — a stale "sent ✓" is a claim about the past.
 */
function renderDocument(d, notice) {
  if (d.kind === 'ewa') {
    if (typeof window.renderEwa !== 'function') {
      // ewa.js failed to load. Refuse rather than fall through to a renderer that
      // would silently omit the terms this document turns on.
      done('⚠️', 'This authorization could not load',
        'Please open the link again. Nothing here was recorded.');
      return;
    }
    // `logoTile` rides in the helper bag beside `initials`, for the same stated reason
    // the rest do: ONE tile renderer on this page. The EWA is a signable authorization
    // with the same letterhead question as the priced document — a client asked to
    // authorise T&M work should see who is asking, not two letters in a box.
    window.renderEwa(d, ewaTerms, { screen, done, esc, usd, initials, logoTile, answer,
                                    askQuestion, declineFlow, photoStrip, threadHtml,
                                    notice: notice || null });
    afterDocumentRender(d);
    return;
  }
  // A price present means this is a priced approval; otherwise the legacy confirm.
  (d.amount_cents != null) ? renderPriced(d, notice) : renderPlain(d, notice);
  afterDocumentRender(d);
}

/**
 * Everything the conversation needs, attached in the ONE place all three renderers
 * pass through.
 *
 * It is here and not inside each renderer because `renderEwa` lives in a separate
 * file that is uploaded separately (DEF-6 is the standing proof the two can be out of
 * step on the host). Wiring from the caller means an EWA gets the composer and the
 * unread banner without ewa.js knowing either exists.
 */
function afterDocumentRender(d) {
  wireThread(d);
  updateUnseenChrome(d);
}

/**
 * NOTICE WHEN THE CONTRACTOR ANSWERS, without asking the client to do anything.
 *
 * The gap this closes: the client asks "does that include the permit?", the
 * contractor replies from his phone, and the client — who has no account, no app and
 * no notification — sits on a page that will never change. The only way they learned
 * a reply existed was to go back into their messages and tap the link again, which is
 * precisely the "would someone who does not think in software succeed here" test in
 * CLAUDE.md. Most people simply wait, and the contractor reads that as being ignored.
 *
 * Three triggers, and the first is the one that matters:
 *   * `visibilitychange` — the phone was locked, or they switched to Messages to text
 *     the contractor, and came back. That is when a reply has most likely landed.
 *   * a slow poll while the page is genuinely on screen.
 *   * a FASTER poll for a few minutes after the client sends something, because that
 *     is the one window in which a reply is actually likely. Deliberately not a
 *     socket: "like a messenger, but not 100% real time" (hadar, 2026-08-24) is the
 *     right trade for a page that runs on a homeowner's phone battery over LTE.
 *
 * ONLY THE THREAD CARD IS REPLACED, never the page. A re-render would wipe a
 * half-typed signature out of the name field under the client's thumb, and this page
 * exists to collect exactly that signature. `#thread` is the seam.
 *
 * CHANGE IS DETECTED BY CONTENT, NOT BY COUNT. It used to compare `length` alone, so
 * a thread that gained a message and lost one between two polls — which is exactly
 * what a Revise & Resend does to the lineage walk — read as "nothing happened" and
 * the client sat looking at a conversation that had moved on without them.
 *
 * It stops the moment the document is answered: a terminal record does not change,
 * and polling it forever is battery spent on a question already settled.
 */
const REPLY_POLL_MS = 25000;
const REPLY_POLL_HOT_MS = 8000;
const REPLY_HOT_WINDOW_MS = 180000;
let hotPollUntil = 0;

function threadSignature(d) {
  return (d.__thread || [])
    .map((m) => `${m.side}|${m.at}|${(m.body || '').length}|${(m.media || []).length}`)
    .join('~');
}

function watchForReplies(d) {
  let stopped = false;
  const stop = () => { stopped = true; };
  // Re-read after any answer this page itself records. `answer()` and the decline
  // path both replace the whole screen, so the poller would be updating an element
  // that no longer exists.
  window.addEventListener('ezjb:answered', stop);

  const tick = async () => {
    if (stopped || document.visibilityState !== 'visible') return;
    if (!document.getElementById('thread')) return;
    const before = threadSignature(d);
    await loadThread(d);
    if (threadSignature(d) === before) return;
    // Replace the card in place and say so. Without the cue a reply can appear
    // above the fold while the client is reading the price and never be noticed.
    redrawThread(d, { highlight: true });
  };

  document.addEventListener('visibilitychange', () => { void tick(); });

  // Self-scheduling rather than `setInterval`, so the cadence can change between
  // ticks without tearing down a timer.
  const loop = () => {
    if (stopped) return;
    const wait = Date.now() < hotPollUntil ? REPLY_POLL_HOT_MS : REPLY_POLL_MS;
    setTimeout(async () => { await tick(); loop(); }, wait);
  };
  loop();
}

// PRD R4 — the photo strip.
//
// The <=3s-on-LTE AC is met by three things together, and none of them alone:
//   1. `url` is a Storage signed URL carrying a resize+quality transform, so the
//      bytes on the wire are a phone-sized JPEG and not a 9 MB camera original.
//   2. `eager` is decided on the device against a stated byte budget
//      (src/approvalphotos.ts). Only what fits in the budget loads with the page;
//      the rest is loading="lazy", which the browser does not fetch at all until the
//      client scrolls to it. So the load time does not grow with photo count.
//   3. the tiles reserve their space, so a slow photo never reflows the page.
//
// The transform is a storage-tier feature and can refuse. `onerror` falls back to the
// untransformed object exactly once (`this.onerror = null` first, or a broken object
// loops forever). Slower, still the right photo, never an empty box.
//
// Each tile links to the full-size original: the client zooming into the crack is the
// entire point of attaching a photo to a price. A plain <a> does that with no
// lightbox, no JS, and no way to get stuck in a modal on a phone.
function photoStrip(photos) {
  if (!photos || !photos.length) return '';
  const tiles = photos.map((p) => {
    const full = esc(p.fallback_url || p.url);
    const when = p.captured_at_ms
      ? new Date(Number(p.captured_at_ms)).toLocaleDateString() : '';
    // NO DATE BURNED INTO THE TILE. It was a white caption over the bottom of every
    // photograph — on a document, that reads as part of the evidence rather than as
    // metadata, and the design does not have it. The capture date is on the record;
    // the tile is the picture.
    return `<a class="shot" href="${full}" target="_blank" rel="noopener" title="${esc(when)}">
        <img src="${esc(p.url)}" data-full="${full}" alt="Photo of the work"
             loading="${p.eager ? 'eager' : 'lazy'}" decoding="async"
             ${p.eager ? 'fetchpriority="high"' : ''}
             onerror="this.onerror=null;this.src=this.dataset.full">
      </a>`;
  }).join('');
  const first = photos[0] && (photos[0].fallback_url || photos[0].url);
  return `<div class="shots">${tiles}</div>
    ${first ? `<a class="allshots" href="${esc(first)}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      View all photos (${photos.length})</a>` : ''}`;
}

/**
 * "WHAT CHANGED" — the banner over a revised change order (hadar's design, 2026-08-09/10).
 *
 * THE PROBLEM IT SOLVES. REQ-LC22 retires the old link and issues a new one, so from
 * the client's side a revision arrives as a second text carrying a second document
 * that looks almost exactly like the first. Spotting the difference is entirely their
 * job. A homeowner who cannot see what moved either re-reads everything or — far more
 * likely — approves without doing so, which is a signature given without knowing what
 * changed.
 *
 * IT IS A SUMMARY, NOT THE INSTRUMENT, and the copy says so in as many words. Mandate
 * #5: the frozen `shown_content` below is what is being signed. This sits ABOVE the
 * document as a "look here" and never inside it. 400 computes it from the structured
 * columns of the two versions rather than diffing the rendered legal text, because a
 * text diff of an instrument produces line-noise on any rewording — and the only
 * thing worse than not telling someone what changed is telling them wrongly on the
 * page where they sign.
 *
 * COLLAPSED BY DEFAULT on a phone, because the design draws it that way and because
 * the banner's one sentence is the part that must be read; the columns are the detail
 * for someone who wants it. <details> does this with no JS and no state to get wrong.
 */
function changesHtml(d) {
  const c = d.__changes;
  if (!c) return '';
  const when = c.updated_at
    ? new Date(c.updated_at).toLocaleString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';
  // "after your conversation" is TWO FACTS, not a causal claim: there were messages on
  // the version this replaced, and then the document changed. Both are checkable. The
  // page must not assert that the conversation caused the change — it does not know.
  const lead = c.after_conversation
    ? 'This change order was updated after your conversation.'
    : 'This change order was updated and replaces the earlier version.';

  const cell = (f) => {
    if (f.key === 'price') {
      const now = f.now != null ? usd(f.now) : (f.now_nte != null ? `up to ${usd(f.now_nte)}` : '—');
      const was = f.was != null ? usd(f.was) : (f.was_nte != null ? `up to ${usd(f.was_nte)}` : null);
      return `<div class="wcc"><div class="wch">Price</div>
        <div class="wcv">${f.changed && was ? `<s>${esc(was)}</s> → ` : ''}${esc(now)}</div>
        ${f.changed ? '' : '<div class="wcm">No change</div>'}</div>`;
    }
    if (f.key === 'schedule') {
      const now = f.now_days ? `Adds ${esc(String(f.now_days))} working day${f.now_days === 1 ? '' : 's'}`
                             : esc(f.now || 'No change');
      return `<div class="wcc"><div class="wch">Schedule</div><div class="wcv">${now}</div></div>`;
    }
    // Exclusions. The WHOLE new text, not a word-level diff: "Added: …" would require
    // knowing which clause is new, and getting that wrong on the not-included list is
    // the single most expensive mistake this page could make.
    return `<div class="wcc"><div class="wch">${esc(f.label)}</div>
      <div class="wcv">${esc(f.now || 'Nothing excluded')}</div>
      ${f.was ? `<div class="wcm">Previously: ${esc(f.was)}</div>` : ''}</div>`;
  };

  const fields = Array.isArray(c.fields) ? c.fields : [];
  return `<div class="wcbar">
    <details class="wcd" open>
      <summary class="wctop">
        <span class="wcmark">↻</span>
        <span class="wcmsg">
          <span class="wcwhen">${when ? `Updated ${esc(when)}` : 'Updated'}</span>
          <span class="wclead">${esc(lead)}</span>
        </span>
        <span class="wcbtn">See what changed</span>
      </summary>
      <div class="wcgrid">${fields.map(cell).join('')}</div>
      ${c.scope_rewritten ? `<p class="wcnote"><b>The work itself was rewritten.</b>
        Please read the description below again rather than relying on this summary.</p>` : ''}
      <p class="wcnote">This is a summary to show you where to look. What you approve
        is the document below${c.versions > 1 ? ` — version ${esc(String(c.versions))}` : ''}.</p>
      <a class="wclink" href="#thread">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-3px"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <b>View conversation</b><br><span class="wcm">See the discussion →</span></a>
    </details>
  </div>`;
}

/**
 * THE PROJECT PAGE — the phone half of the portal (hadar's mobile design, 2026-08-09).

 * On a desktop the project lives in a sidebar beside the document. A 390px phone has
 * no room beside anything, so the same content becomes its own SCREEN and the
 * document gets a "← All change orders" way back to it. Same data, same server gate
 * (`confirmation_project_v1`, live tokens only) — the difference is layout, not
 * permission, and there is deliberately no second authorization path here.
 *
 * IT IS A VIEW OF THE SAME URL, not a second page. `?t=<token>&v=project` renders
 * this; dropping `v` renders the document. That matters more than it looks: the
 * token is the credential, the client got exactly one link by SMS, and a portal
 * spread over two addresses would mean a second link to lose. Back and forward work
 * because each view is a real history entry.
 */
function projectHtml(d) {
  const pr = d.__project;
  if (!pr) return '';
  const company = d.company_name || 'Your contractor';
  const orders = Array.isArray(pr.orders) ? pr.orders : [];
  const waiting = orders.filter((o) => !o.answered_action);
  const answered = orders.filter((o) => o.answered_action);
  const approved = answered.filter((o) => o.answered_action === 'confirmed');

  const row = (o, tick) => {
    const label = `${o.co_number != null ? `<b>CO #${esc(String(o.co_number))}</b> ` : ''}${esc(o.title || 'Extra work')}`;
    const amt = o.amount_cents != null ? `<span class="sra">${esc(usd(o.amount_cents))}</span>` : '';

      ? (o.answered_at ? `Approved ${esc(new Date(o.answered_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }))}` : 'Approved')
      : (o.issued_at ? esc(new Date(o.issued_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })) : '');
    const inner = `${tick ? '<span class="srtick">✓</span>' : ''}

      </span>${amt}${o.token ? '<span class="srchev">›</span>' : ''}`;
    // Only a LIVE token opens a row. Everything else is a fact, not a door — an
    // approved change order whose link has been answered has no page left to open,
    // and a chevron promising one is a lie the client discovers by tapping.
    return o.token
      ? `<a class="srow${o.token === token ? ' here' : ''}" href="?t=${encodeURIComponent(o.token)}">${inner}</a>`
      : `<div class="srow">${inner}</div>`;
  };

  return `
    <div class="pbar">
      ${logoTile(company, d.__logoUrl)}

    <div class="wrap">

        ${pr.project_address ? `<div class="saddr">${esc(pr.project_address)}</div>` : ''}
      </div>

      <h2 class="ph2">Change orders</h2>
      <div class="scounts">
        <div class="scount need"><div class="scl">Needs your approval</div><div class="scv">${waiting.length}</div></div>
        <div class="scount"><div class="scl">Approved</div><div class="scv">${approved.length}</div></div>
      </div>

      ${waiting.length ? `<div class="slab">Needs your approval</div>${waiting.map((o) => row(o, false)).join('')}` : ''}
      ${answered.length ? `<div class="slab">Answered</div>${answered.map((o) => row(o, o.answered_action === 'confirmed')).join('')}` : ''}

      <div class="sask">
        <div class="saskh">Questions?</div>

          Asking approves nothing.</div>

/**
 * The phone's bottom bar.
 *
 * TWO TABS, NOT THREE. The design draws Project · Messages · Documents. The first two
 * are real — the project view above, and the discussion, which already exists on
 * both sides and now carries photos. THERE IS NO DOCUMENTS FEATURE: nothing in this
 * product stores a client-visible document library, so a third tab would be a button
 * that either does nothing or opens an empty room. It is left out rather than
 * stubbed. When documents exist, this is the one place that changes.
 *
 * Hidden on desktop, where the sidebar is always on screen and a floating bar would
 * be navigation for a page that is not navigating.
 */
function tabsHtml(d, active) {
  if (!d.__project) return '';
  // `data-tab` is the badge's only hook. `setTabBadge` needs to find the Messages
  // glyph from outside this function, and matching on the label text would break the
  // first time this page is translated.
  const tab = (key, label, glyph, href) =>
    `<a class="tab${active === key ? ' on' : ''}" data-tab="${key}" href="${href}">
       <span class="tabg">${glyph}</span><span>${label}</span></a>`;
  const base = `?t=${encodeURIComponent(token)}`;
  return `<nav class="tabs">
    ${tab('project', 'Project', '⌂', `${base}&v=project`)}

}

/**
 * THE SIDEBAR (hadar's desktop portal design, 2026-08-09).
 *
 * What it is FOR: a client who has approved three change orders on this job and has
 * two waiting is not reading one document, they are managing a relationship. The
 * sidebar is the only place this page has ever told them that. It carries the
 * project, both lists, and one way to reach a human.
 *
 * ─── IT IS GATED, AND THE GATE IS ON THE SERVER ─────────────────────────────────
 * `confirmation_project_v1` returns {} unless the token is LIVE — not superseded and
 * not yet answered (399, hadar's choice 2026-08-09). So an old link forwarded to a
 * neighbour still opens the document it was minted for and shows NO sidebar. This
 * function never has to decide that; it renders what it is given, and an absent
 * project is simply a page with one column. Do not add a client-side test here — a
 * check in this file protects nothing, because the data would already have arrived.
 *
 * DRAFTS ARE NOT IN `orders` (the server excludes them). A client must never learn
 * that a draft exists, let alone what it might cost.
 */
function sidebarHtml(d) {
  const pr = d.__project;
  if (!pr) return '';
  const company = (d.__company && d.__company.name) || d.company_name || 'Your contractor';
  // The person to message, when we know one. The design addresses a human ("Message
  // John Davis"); with no contact on file the company is the honest stand-in and we
  // never invent a name.
  const who = (d.__contact && d.__contact.name) || company;
  const orders = Array.isArray(pr.orders) ? pr.orders : [];
  const mine = (o) => o.token && o.token === token;

  const waiting = orders.filter((o) => !o.answered_action);
  const answered = orders.filter((o) => o.answered_action);

  // A row links only when a LIVE token exists for it. Everything else renders as
  // plain text: a dead link on a homeowner's page is worse than no link, because
  // tapping it produces an error page about a document they were told they could see.
  const row = (o, tick) => {
    const label = `${o.co_number != null ? `<b>CO #${esc(String(o.co_number))}</b> ` : ''}${esc(o.title || 'Extra work')}`;
    const amt = o.amount_cents != null ? `<span class="sra">${esc(usd(o.amount_cents))}</span>` : '';
    const when = tick
      ? (o.answered_at ? `Approved ${esc(new Date(o.answered_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }))}` : 'Approved')
      : (o.issued_at ? esc(new Date(o.issued_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })) : '');
    // "From <name>" — the design's second line. Omitted rather than faked when nobody
    // is on file: a row that names the wrong person on a money document is worse than
    // a row with one line less.
    const from = (!tick && who && who !== company) ? `<span class="srm">From ${esc(who)}</span>` : '';
    const inner = `${tick ? '<span class="srtick">✓</span>' : ''}
      <span style="flex:1;min-width:0">
        <span class="srt">${label}</span>${from}${when ? `<span class="srm">${when}</span>` : ''}
      </span>${amt}<span class="srchev">›</span>`;
    return (o.token && !mine(o))
      ? `<a class="srow" href="?t=${encodeURIComponent(o.token)}">${inner}</a>`
      : `<div class="srow${mine(o) ? ' here' : ''}">${inner}</div>`;
  };

  return `<aside class="side">
    <div class="sbrand">
      ${logoTile(company, d.__logoUrl)}
      <div>
        <div class="sbc">${esc(company)}</div>
        ${d.__company && d.__company.tagline ? `<div class="sbt">${esc(d.__company.tagline)}</div>` : ''}
      </div>
    </div>

    <div class="sh">Your project</div>
    ${pr.hero_url ? `<img class="phero" src="${esc(pr.hero_url)}" alt="" loading="lazy">` : ''}
    <div class="sproj">${esc(pr.project_name || d.job_label || 'This job')}</div>
    ${pr.project_address && pr.project_address !== (pr.project_name || '')
      ? `<div class="saddr">${esc(pr.project_address)}</div>` : ''}
    <a class="slink" href="?t=${encodeURIComponent(token)}&v=project">View project details →</a>

    <div class="sh">Change orders</div>
    <div class="scounts">
      <div class="scount need"><div class="scl">Needs your approval</div><div class="scv">${waiting.length}</div></div>
      <div class="scount"><div class="scl">Approved</div><div class="scv">${answered.filter((o) => o.answered_action === 'confirmed').length}</div></div>
    </div>

    ${waiting.length ? `<div class="slab">Needs your approval</div>${waiting.map((o) => row(o, false)).join('')}` : ''}
    ${answered.length ? `<div class="slab">Answered</div>${answered.map((o) => row(o, o.answered_action === 'confirmed')).join('')}` : ''}

    <a class="slink" href="?t=${encodeURIComponent(token)}&v=project">View all change orders →</a>

    <div class="sask">
      <div class="saskh">Questions?</div>
      <div class="saskrow">
        <div class="lhav">${esc(initials(who))}</div>
        <div class="saskt">Message ${esc(who)} directly if anything here is unclear.
          Asking approves nothing.</div>
      </div>
      <button class="ghost sasbtn" id="asksidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        Message ${esc(firstWord(who))}</button>
    </div>
    <div class="sfoot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;vertical-align:-2px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure approvals<br>powered by EZChangeOrders
    </div>
