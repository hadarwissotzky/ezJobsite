<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approval</title>
<!--
  The no-login approval page — REQ-VAL1/2/3/8, and the client-facing REPORT.

  WHO IS READING THIS: a homeowner or a GC standing in a doorway, on their own
  phone, who has never heard of this app and will never make an account for it.
  They tapped a link a contractor texted them. If this page asks them to sign up,
  install anything, or work out what a "disposition" is, the contractor does not
  get their answer and the job stops. REQ-VAL3's no-login rule is not a
  convenience -- it is the only reason this loop closes at all.

  WHAT IT SHOWS (2026-07-20): for an EXTRA, the money is the report. The page now
  renders the priced approval -- who is asking, the scope, the FIXED PRICE, the
  running total already approved on the job, and a type-your-name-to-sign action.
  Every value is FROZEN at send (confirmation_fetch returns exactly what was
  stored): the price shown here is the price signed here. It cannot drift from the
  binding record, because the record is what it reads.

  WHY THIS IS A STATIC FILE IN A STORAGE BUCKET, and not an Edge Function:
  the page is inert. Every value it displays comes from confirmation_fetch(token),
  already granted to anon. There is no server logic to host.

  THE ANON KEY IS PUBLIC BY DESIGN. It identifies the project; RLS plus the RPC
  grants are what protect the data. anon can reach exactly two functions, no table.

  THE TOKEN IS THE CREDENTIAL. Whoever holds the link can answer. That is the trade
  REQ-VAL3 makes deliberately, stated plainly rather than dressed up.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0D0F12; --paper:#FAFAF8; --card:#FFFFFF; --orange:#FF5A00;
    --steel:#5C6570; --line:#E4E5E1; --approve:#0E8A4C; --caution:#F5B000; --danger:#C6281C;
    --disp:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body:'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--body); font-size: 17px; line-height: 1.5;
    margin: 0; padding: 0 0 40px; background: var(--paper); color: var(--ink);
    max-width: 480px; margin-inline: auto; min-height: 100vh;
  }
  .wrap { padding: 0 16px; }

  /* Branded header — who is asking + which job. */
  .brand { display: flex; align-items: center; gap: 12px; padding: 22px 16px 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--disp); font-weight: 700; font-size: 18px; letter-spacing: .5px; flex: none;
  }
  .cn { font-family: var(--disp); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .3px; line-height: 1.1; }
  .cs { font-size: 13.5px; color: var(--steel); margin-top: 2px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; margin-bottom: 12px;
  }
  .kicker { font-family: var(--disp); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
  .title { font-family: var(--disp); font-weight: 700; font-size: 26px; line-height: 1.12; text-transform: uppercase; letter-spacing: .3px; margin: 6px 0 0; }
  .scope { font-size: 16px; color: #26292e; margin-top: 10px; line-height: 1.55; }

  .price { display: flex; justify-content: space-between; align-items: baseline; }
  .pl { font-family: var(--disp); font-weight: 600; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; color: var(--steel); }
  .pv { font-family: var(--disp); font-weight: 700; font-size: 40px; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  /* The qualifier on an EWA cap ("max"). Sized down and kept on the same line as the
     figure: at .pv's 40px it wrapped, and a cap whose qualifier is orphaned reads for
     a moment as a fixed price. */
  .pvq { font-family: var(--disp); font-weight: 600; font-size: 17px; letter-spacing: .06em;
         text-transform: uppercase; color: var(--steel); margin-left: 6px; white-space: nowrap; }
  .clause { font-size: 13.5px; color: var(--steel); margin-top: 8px; line-height: 1.5; }
  .totals { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .trow { display: flex; justify-content: space-between; font-size: 14.5px; padding: 3px 0; color: var(--steel); }
  .trow b { color: var(--ink); font-family: var(--disp); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }

  /* PHOTOS — PRD R4. The evidence the client is being asked to believe.
     Two columns with the first tile spanning both: the opening shot of the walk is
     the one that says what this is about, and a uniform grid of thumbnails on a
     phone reads as decoration rather than as the thing you are approving.
     `aspect-ratio` + a filled background means every tile reserves its space BEFORE
     the bytes land, so the page does not reflow under the client's thumb while the
     images stream in on LTE — which on a slow link is how you get an accidental tap
     on a button that just moved. */
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
  .shot { position: relative; display: block; border-radius: 12px; overflow: hidden;
          background: #ECEDEA; aspect-ratio: 4 / 3; }
  .shot:first-child { grid-column: 1 / -1; aspect-ratio: 3 / 2; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shotd { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 8px;
           font-size: 11.5px; color: #fff; letter-spacing: .02em;
           background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); }

  /* Frozen legal wording, available but not shouting. */
  .exact { margin-top: 10px; }
  .exact summary { font-size: 13px; color: var(--steel); cursor: pointer; }
  .sow { white-space: pre-wrap; font-size: 15.5px; line-height: 1.55; color: #26292e; margin-top: 8px; }
  .fromline { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .terms { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .tline { font-size: 14px; line-height: 1.5; color: #26292e; margin-top: 4px; }
  .exact .doc { white-space: pre-wrap; background: #F3F4F2; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13.5px; line-height: 1.55; margin-top: 8px; color: #26292e; }

  /* Actions. Big, thumb-sized — answered one-handed, outdoors. */
  .sign { width: 100%; font-family: var(--body); font-size: 17px; padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); margin-bottom: 10px; }
  .sign:focus { outline: none; border-color: var(--ink); }
  button {
    font-family: var(--disp); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase;
    border: 0; border-radius: 14px; padding: 17px; cursor: pointer; width: 100%; min-height: 60px;
  }
  .approve { background: var(--approve); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .approve:disabled { opacity: .4; }
  /* A BORDER, BECAUSE A CHOICE HAS TO LOOK LIKE ONE.
     `background: none` with no border rendered these as bare text under a large green
     button -- seen for the first time when the page was actually opened in a browser,
     2026-07-21. PRD R5 says approve / ask / decline are three distinct outcomes; on a
     phone this read as one button and two lines of footer copy. The client most likely
     to need "Ask a question instead" is the one least likely to recognise unbordered
     text as tappable, which is the core design test in CLAUDE.md: would someone who
     does not think in software succeed here without being taught?
     The card and the decline-confirmation button in this same file already carry
     `1px solid var(--line)`; these were simply missed. */
  .ghost {
    background: var(--card); color: var(--steel); font-size: 16px; margin-top: 10px;
    border: 1px solid var(--line);
  }
  .decline { background: none; color: var(--danger); border: 1.5px solid #E4C4C4; }
  .recordnote { font-size: 12px; color: var(--steel); text-align: center; margin-top: 12px; line-height: 1.5; }

  /* The "your question was sent" acknowledgement, at the top of the redrawn document.
     It replaces a full-screen terminal confirmation, so it has to carry the same
     weight without taking the page: a green rule and a filled background, above the
     fold, where the eye lands after a screen transition. Not a toast — a toast that
     fades is exactly the wrong shape for a client who looks up from the page and back
     down again ten seconds later. */
  .notice {
    background: #E8F5EE; border: 1px solid #BFE3CE; border-left: 4px solid var(--approve);
    border-radius: 12px; padding: 12px 14px; margin: 12px 0 0;
    font-size: 15px; line-height: 1.45; color: #14432B;
  }

  textarea { width: 100%; font-family: var(--body); font-size: 16px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); margin: 10px 0; min-height: 88px; resize: none; }

  /* Legacy plain-confirm fallback (no price). */
  .plaincard { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-size: 16.5px; line-height: 1.6; }
  h1.plain { font-size: 21px; margin: 4px 0 16px; line-height: 1.3; }
  .who { font-size: 14px; color: var(--steel); margin-bottom: 4px; }
  .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .yes { background: var(--approve); color: #fff; }
  .no { background: none; color: var(--danger); border: 1.5px solid #E4C4C4; }

  /* Terminal screens. */
  .done { text-align: center; padding: 46px 22px; }
  .done .mark { font-size: 52px; line-height: 1; }
  .done h2 { font-family: var(--disp); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; font-size: 26px; margin: 16px 0 8px; }
  .done p { color: var(--steel); font-size: 15.5px; line-height: 1.55; margin: 0; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<div id="root"><div class="done"><div class="mark">·</div><p>Loading…</p></div></div>

<!-- PRD R3 AC2. A SEPARATE FILE on purpose: this page renders a PRICED approval —
     a big number, a running total, and "Nothing proceeds until you approve." All
     three are wrong for an Extra Work Authorization, which has no price, and on a
     T&M-capped term work proceeds precisely BECAUSE it was approved. A classic
     script runs before any module, so window.renderEwa is set by the time the
     dispatch below needs it. -->
<script src="ewa.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Injected at deploy time. The anon key is public by design (see the top comment).
const SUPABASE_URL = '__SUPABASE_URL__';
const ANON_KEY = '__ANON_KEY__';

const supabase = createClient(SUPABASE_URL, ANON_KEY);
const root = document.getElementById('root');
// The link may arrive either way: ?t=TOKEN (works on any static host with no
// rewrite) or a pretty /c/TOKEN path (needs a host rewrite). Accept both so the
// choice of host never silently breaks every link.
const token = new URLSearchParams(location.search).get('t')
  || (location.pathname.match(/\/c\/([^/?#]+)/) || [])[1] || null;

// The EWA's structured terms, held at module scope so a redraw (Back, or the return
// from the question screen) does not need to re-fetch them and cannot redraw the
// authorization without them. `renderEwa` fails closed on null, which is the correct
// outcome if they were never fetched — an authorization missing its proceed term must
// not be signable.
let ewaTerms = null;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Integer cents -> "$1,850". Money never becomes a float here either.
const usd = (cents) => {
  if (cents == null) return '';
  const s = Math.abs(cents).toString().padStart(3, '0');
  const whole = s.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '$' + whole + '.' + s.slice(-2);
};
// Initials for the logo tile, from the company name.
const initials = (name) => String(name || '')
  .split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '•';

function screen(html) { root.innerHTML = html; }
function done(mark, title, sub) {
  screen(`<div class="done"><div class="mark">${mark}</div>
    <h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`);
}

async function load() {
  if (!token) { done('⚠️', 'This link is incomplete', 'Ask for the link again.'); return; }

  // Both reads go out together. They share only the token and neither needs the
  // other's answer, so awaiting them in series just made the client wait two round
  // trips before seeing anything — on the bad-signal phone this page is built for,
  // that is the whole perceived load time, doubled, for no reason.
  //
  // A link is retired the moment a newer one is issued for the same change order
  // (250_one_live_link), so an old text message can no longer be signed at a stale
  // price. Say that here rather than letting the client read, type their name and
  // only THEN hit a refusal. Checked separately because confirmation_fetch is one of
  // the four already-duplicated functions and extending it would add a fifth.
  //
  // PRD R4's photos ride along as a THIRD parallel call, not a fourth field on
  // confirmation_fetch. Two reasons, and the second is the one that matters:
  //   * confirmation_fetch is owned by 200_priced_approval.sql and has already been
  //     redefined across files once, at real cost. 304_approval_photos.sql owns this
  //     one and nothing else touches it.
  //   * it is inside the SAME Promise.all, so it costs ZERO extra round trips against
  //     the AC's 3 seconds. The photos themselves are what has to fit in that budget,
  //     not the question of whether there are any.
  const [{ data, error }, { data: st }, ph] = await Promise.all([
    supabase.rpc('confirmation_fetch', { p_token: token }),
    supabase.rpc('confirmation_state', { p_token: token }),
    supabase.rpc('confirmation_photos', { p_token: token }),
  ]);
  if (error) { done('⚠️', 'Could not load this', 'Check your connection and open the link again.'); return; }

  if (st && st.found && st.superseded && !st.answered) {
    // R6 AC2: LINK to the current version, do not describe it. This used to say
    // "please open the most recent link they texted you", which asks a homeowner
    // standing in a doorway to go hunting through their SMS history and diff two
    // near-identical URLs by eye. The live token was in the database the whole time.
    //
    // The URL is built from THIS page's own origin, never from a base stored
    // server-side: a second source of truth for where this page lives has already
    // been wrong once (EXPO_PUBLIC_CONFIRM_BASE pointed at a domain that did not
    // exist). Whatever host served this link serves the next one.
    //
    // live_token is null when a link was retired with no replacement — the
    // contractor changed his mind. That is a real state and it keeps the old copy,
    // because sending someone to a page that does not exist is worse than telling
    // them to ask.
    const live = st.live_token
      ? `${location.pathname}?t=${encodeURIComponent(st.live_token)}`
      : null;
    screen(`<div class="done"><div class="mark">🔄</div>
      <h2>This version was replaced</h2>
      <p>${live
        ? 'The contractor sent an updated version. Nothing here was recorded.'
        : 'The contractor withdrew this request. Nothing here was recorded — ask them for a new link.'}</p>
      ${live ? `<div class="btns"><a class="yes" style="display:block;text-decoration:none;text-align:center"
           href="${esc(live)}">Open the current version</a></div>` : ''}
      </div>`);
    return;
  }

  // R6 AC: "opened twice and questioned once -> the timeline shows each event."
  // Logged HERE, after the fetch succeeded and BEFORE any branch, so an open counts
  // whether they approve, ask, decline, or just read it and put the phone down —
  // "she opened it three times and has not answered" is the signal that tells a
  // contractor whether to chase, and it is only true if every open is counted.
  //
  // Fire-and-forget on purpose. This is bookkeeping about the page, and it must
  // never delay or block what the client came here to do. The RPC no-ops on an
  // unknown token rather than erroring, so a bad link still shows "not valid"
  // instead of a network failure.
  //
  // ── `Promise.resolve(...)` IS LOAD-BEARING. IT IS THE FIX FOR A TOTAL OUTAGE ──
  // This line read `supabase.rpc(...).catch(...)`. What `rpc()` returns is a
  // PostgrestFilterBuilder — a THENABLE, not a Promise. It has `.then()`; it does not
  // have `.catch()`. So the line threw `supabase.rpc(...).catch is not a function`
  // SYNCHRONOUSLY, inside `load()`, which is called at the bottom of this module with
  // no error handling — and an async function that throws returns a rejected promise
  // nobody is listening to.
  //
  // The consequence: EVERY approval link, of every kind, stopped at "Loading…" and
  // never rendered anything. No error on screen, nothing in the console (an unhandled
  // rejection is not a console error), and the three RPCs above visibly succeeded in
  // the network tab — so the page looked like a slow server rather than a dead one.
  // Reproduced against the live database and the token in `confirmation_request` on
  // 2026-08-06, on the page as committed, before any change in this pass.
  //
  // The version drift that caused it is the second half of the lesson, recorded
  // because the fix does not remove it: this page imports
  // `https://esm.sh/@supabase/supabase-js@2` — an UNPINNED major range, resolved at
  // page load, off a CDN. The builder used to extend Promise; it no longer does. So a
  // patch release on someone else's server disabled the entire client-facing half of
  // this product with no deploy, no commit and no signal. See docs/CLIENT-PORTAL.md
  // §"Open questions" — pinning is a decision, not a cleanup.
  //
  // `Promise.resolve(thenable)` adopts it and gives back a real Promise, so this is
  // correct against both the old shape and the new one.
  Promise.resolve(
    supabase.rpc('confirmation_opened', { p_token: token, p_user_agent: navigator.userAgent })
  ).catch(() => { /* 366 not applied yet, or offline. The page is unaffected. */ });

  if (data.status === 'not_found') { done('⚠️', 'This link is not valid', 'It may have been mistyped. Ask for a new one.'); return; }
  if (data.status === 'expired') { done('⏰', 'This link has expired', 'Ask for a new one — nothing is lost.'); return; }

  // Photos are OPTIONAL and their absence is never an error. On a database where
  // 304_approval_photos.sql has not been applied the RPC does not exist and `ph.error`
  // is set — the approval must still render and still be signable. An extra with no
  // photos is a legal extra (PRD R4 says "0-8"), so the two cases collapse to the
  // same empty list rather than to a failure screen.
  data.photos = (ph && ph.data && Array.isArray(ph.data.photos)) ? ph.data.photos : [];

  // THE CONVERSATION IS FETCHED BEFORE ANY BRANCH (DEF-5).
  //
  // It used to be fetched between the EWA dispatch and the priced render, which meant
  // exactly two of the three documents this page can draw ever had a thread:
  //   * an EWA returned at the `kind === 'ewa'` dispatch, above the fetch, so an owner
  //     holding an authorization link could not see a single message either side had
  //     written about it;
  //   * an ANSWERED link returned even earlier, so the moment a client signed, the
  //     discussion that led to the signature disappeared from the only copy they have.
  // Both are REQ-LC33 — "Stage 3 is readable forever, BY BOTH PARTIES, at the same
  // address" — and the party with the least access and the most at stake is the one
  // who signed. So the fetch is hoisted above every branch that renders a document,
  // and each of them renders it.
  //
  // confirmation_thread (308) supersedes confirmation_questions (220): it returns the
  // contractor's replies too and walks the revision lineage, so a conversation
  // survives a Revise & Resend instead of restarting at the new link.
  await loadThread(data);

  if (data.status === 'already_answered') {
    // R6 AC2, the CLIENT's half. This used to be a bare "done" screen: an emoji, a
    // line of text, and nothing else. The client had just typed their name onto a
    // priced commitment and the document itself became unreadable to them the
    // instant they signed it — the contractor kept a copy on the record screen and
    // the person who signed did not.
    //
    // That is the wrong way round. They are the party with the least access and the
    // most at stake, and "either party opening the record later sees the identical
    // immutable snapshot" is the requirement. So the frozen wording stays on the
    // page, verbatim, after the answer. Collapsed by default because the answer is
    // the headline — but one tap away, forever, at the same link.
    const when = data.answered_at ? new Date(data.answered_at).toLocaleString() : '';
    const who = data.signed_name ? ` by ${data.signed_name}` : '';
    const approved = data.answered_action === 'confirmed';
    const title = approved
      ? `Already approved${who ? ' — signed' + who.slice(3) : ''}` : 'Already answered';
    const sub = when ? `Answered ${when}. Your answer stands.` : 'Your answer stands.';
    screen(`<div class="done"><div class="mark">${approved ? '✅' : '✋'}</div>
      <h2>${esc(title)}</h2><p>${esc(sub)}</p></div>
      <div class="wrap">
        <div class="card">
          <details class="exact" open>
            <summary>What you signed</summary>
            <div class="doc">${esc(data.shown_content)}</div>
          </details>
          <p class="recordnote">This is the exact wording, kept as it was when you
            answered. It does not change.</p>
        </div>
        ${/* The photos and the discussion are PART of what was signed, so they stay
              at this address too. REQ-LC43 puts the photos inside the instrument by a
              different mechanism (media is immutable and bound to the request), and
              R5b AC3 makes the discussion part of the record. Dropping either the
              moment somebody signs would leave the signer holding less evidence than
              the party they signed with. */''}
        ${photoStrip(data.photos)}
        ${threadHtml(data)}
      </div>`);
    return;
  }

  // R3 AC2: an EWA is a DIFFERENT INSTRUMENT and gets a different page. Dispatch on
  // `kind`, which confirmation_fetch already returns, NOT on the absence of a price:
  // "no amount_cents" is also true of a legacy decision-confirm, and rendering an
  // authorization as one of those would drop the proceed term and the settlement
  // window — the two clauses that decide whether work starts today.
  if (data.kind === 'ewa') {
    // Terms live in their own table (303) and are frozen alongside shown_content.
    // A fetch failure leaves them null, and renderEwa refuses to render an incomplete
    // authorization rather than showing a signable page with clauses missing.
    try {
      const { data: t } = await supabase.rpc('ewa_terms_fetch', { p_token: token });
      ewaTerms = t ?? null;
    } catch { ewaTerms = null; }
  }

  renderDocument(data);
  watchForReplies(data);
}

/**
 * Fetch the conversation onto `d.__thread`.
 *
 * Separated from `load()` so the same call serves three moments: the first render,
 * the return trip after the client asks something, and the poll that notices the
 * contractor answered. One fetch, one shape, no second parser.
 *
 * A failure leaves the PREVIOUS thread in place rather than blanking it. Losing
 * signal mid-poll must never make a client's own question disappear off the page
 * they are looking at — that reads as "it did not send".
 */
async function loadThread(d) {
  try {
    const { data: th } = await supabase.rpc('confirmation_thread', { p_token: token });
    if (Array.isArray(th)) d.__thread = th;
    else if (!Array.isArray(d.__thread)) d.__thread = [];
  } catch { if (!Array.isArray(d.__thread)) d.__thread = []; }
  return d.__thread;
}

/**
 * Draw whichever document this token carries.
 *
 * ONE dispatch, called from three places — the first load, the return from the
 * question screen, and the Back buttons — because there used to be three copies of
 * `d.amount_cents != null ? renderPriced : renderPlain` and none of them knew about
 * the EWA branch, which lived only inside `load()`. An EWA that reached a Back button
 * was therefore redrawn as a priced approval with no price: the proceed term and the
 * settlement window silently gone from a page still offering a signature.
 *
 * `notice` is a one-line banner ("Your question was sent"), rendered by the document
 * renderers above the thread. It is a parameter and not state, so it appears once and
 * does not survive a reload — a stale "sent ✓" is a claim about the past.
 */
function renderDocument(d, notice) {
  if (d.kind === 'ewa') {
    if (typeof window.renderEwa !== 'function') {
      // ewa.js failed to load. Refuse rather than fall through to a renderer that
      // would silently omit the terms this document turns on.
      done('⚠️', 'This authorization could not load',
        'Please open the link again. Nothing here was recorded.');
      return;
    }
    window.renderEwa(d, ewaTerms, { screen, done, esc, usd, initials, answer,
                                    askQuestion, declineFlow, photoStrip, threadHtml,
                                    notice: notice || null });
    return;
  }
  // A price present means this is a priced approval; otherwise the legacy confirm.
  (d.amount_cents != null) ? renderPriced(d, notice) : renderPlain(d, notice);
}

/**
 * NOTICE WHEN THE CONTRACTOR ANSWERS, without asking the client to do anything.
 *
 * The gap this closes: the client asks "does that include the permit?", the
 * contractor replies from his phone, and the client — who has no account, no app and
 * no notification — sits on a page that will never change. The only way they learned
 * a reply existed was to go back into their messages and tap the link again, which is
 * precisely the "would someone who does not think in software succeed here" test in
 * CLAUDE.md. Most people simply wait, and the contractor reads that as being ignored.
 *
 * Two triggers, and the first is the one that matters:
 *   * `visibilitychange` — the phone was locked, or they switched to Messages to text
 *     the contractor, and came back. That is when a reply has most likely landed.
 *   * a slow poll while the page is genuinely on screen.
 *
 * ONLY THE THREAD CARD IS REPLACED, never the page. A re-render would wipe a
 * half-typed signature out of the name field under the client's thumb, and this page
 * exists to collect exactly that signature. `#thread` is the seam.
 *
 * It stops the moment the document is answered: a terminal record does not change,
 * and polling it forever is battery spent on a question already settled.
 */
const REPLY_POLL_MS = 25000;
function watchForReplies(d) {
  let stopped = false;
  const stop = () => { stopped = true; };
  // Re-read after any answer this page itself records. `answer()` and the decline
  // path both replace the whole screen, so the poller would be updating an element
  // that no longer exists.
  window.addEventListener('ezjb:answered', stop);

  const tick = async () => {
    if (stopped || document.visibilityState !== 'visible') return;
    const before = (d.__thread || []).length;
    await loadThread(d);
    const host = document.getElementById('thread');
    if (!host || (d.__thread || []).length === before) return;
    // Replace the card in place and say so. Without the cue a reply can appear
    // above the fold while the client is reading the price and never be noticed.
    host.outerHTML = threadHtml(d, true);
  };

  document.addEventListener('visibilitychange', () => { void tick(); });
  const timer = setInterval(() => { if (stopped) clearInterval(timer); else void tick(); },
                            REPLY_POLL_MS);
}

// PRD R4 — the photo strip.
//
// The <=3s-on-LTE AC is met by three things together, and none of them alone:
//   1. `url` is a Storage signed URL carrying a resize+quality transform, so the
//      bytes on the wire are a phone-sized JPEG and not a 9 MB camera original.
//   2. `eager` is decided on the device against a stated byte budget
//      (src/approvalphotos.ts). Only what fits in the budget loads with the page;
//      the rest is loading="lazy", which the browser does not fetch at all until the
//      client scrolls to it. So the load time does not grow with photo count.
//   3. the tiles reserve their space, so a slow photo never reflows the page.
//
// The transform is a storage-tier feature and can refuse. `onerror` falls back to the
// untransformed object exactly once (`this.onerror = null` first, or a broken object
// loops forever). Slower, still the right photo, never an empty box.
//
// Each tile links to the full-size original: the client zooming into the crack is the
// entire point of attaching a photo to a price. A plain <a> does that with no
// lightbox, no JS, and no way to get stuck in a modal on a phone.
function photoStrip(photos) {
  if (!photos || !photos.length) return '';
  const tiles = photos.map((p) => {
    const full = esc(p.fallback_url || p.url);
    const when = p.captured_at_ms
      ? new Date(Number(p.captured_at_ms)).toLocaleDateString() : '';
    return `<a class="shot" href="${full}" target="_blank" rel="noopener">
        <img src="${esc(p.url)}" data-full="${full}" alt="${esc(when)}"
             loading="${p.eager ? 'eager' : 'lazy'}" decoding="async"
             ${p.eager ? 'fetchpriority="high"' : ''}
             onerror="this.onerror=null;this.src=this.dataset.full">
        ${when ? `<span class="shotd">${esc(when)}</span>` : ''}
      </a>`;
  }).join('');
  return `<div class="card shots">${tiles}</div>`;
}

/**
 * The conversation, rendered on the client's own page.
 *
 * Shown ABOVE the actions, not below: a reply that answers their question is the
 * thing most likely to change the answer they give, and putting it under the
 * Approve button means they decide before they read it.
 *
 * ALWAYS RENDERS THE CARD, even when the thread is empty. It used to return '' on an
 * empty thread, on the reasoning that a heading with nothing under it looks broken —
 * true of a heading, and wrong of a seam. `watchForReplies` replaces `#thread` in
 * place when a reply lands, and with no element on the page there was nothing to
 * replace: the first reply to a client who had not yet asked anything could never
 * appear. The empty state now says what is true ("no messages yet") and, more
 * usefully, says what asking does — which is the affordance a homeowner who wants to
 * negotiate is looking for and could previously only find by reading a button label.
 *
 * `highlight` marks a card redrawn by the poller, so a reply that lands above the
 * fold while the client is reading the price is not silently absorbed into the page.
 */
function threadHtml(d, highlight) {
  const t = d.__thread || [];
  const waitingOnThem = t.length && t[t.length - 1].side === 'client';
  const msgs = t.map((m) => `<div class="clause" style="margin-top:10px">
      <b>${m.side === 'client' ? 'You asked' : esc(d.company_name || 'The contractor')}</b>
      · ${esc(m.at ? new Date(m.at).toLocaleString() : '')}
      <div style="margin-top:3px;color:#26292e">${esc(m.body)}</div>
    </div>`).join('');

  // WHAT HAPPENS NEXT, in the reader's terms, not the system's.
  //
  // The rule underneath this sentence is mandate #2 and R5b's standing prohibition:
  // "price changes resolve only through revision + fresh approval — never through
  // thread agreement". A contractor typing "ok, $1,500" in this thread has changed
  // nothing, and neither has a client typing "I'll pay $1,500". If the page does not
  // say so, a homeowner who negotiates a number in the discussion reasonably believes
  // they have agreed a price, and the next thing they see is a bill for the old one.
  // So the page states the mechanism instead of leaving it to be discovered: a new
  // number arrives as a new link to approve.
  // ANSWERED IS A DIFFERENT CARD. REQ-LC23 closes the thread on the answer, and the
  // server has enforced it since 308 — a reply written afterwards is rejected. So the
  // answered card must not invite one. Telling a client "ask something else" on a
  // page where the server would refuse it is the silent-delivery-failure shape this
  // repo already found once on the contractor's side (DEF-4); it is not repeated here.
  const closed = d.status === 'already_answered';
  const nextStep = closed
    ? (t.length
        ? `This is the discussion as it stood when you answered. It is kept with the
           record and does not change.`
        : '')
    : !t.length
    ? `Nothing here yet. If something is unclear — the price, what is included, the
       timing — ask below. Asking approves nothing.`
    : waitingOnThem
    ? `${esc(d.company_name || 'The contractor')} has your message. You can still
       approve or decline at any time, or ask something else.`
    : `You can reply with another question, or approve or decline above.`;

  // Nothing at all on an answered document that was never discussed: an empty
  // "Discussion" card under a signature is a heading with no content, which is the
  // one case the original `return ''` was right about.
  if (closed && !t.length) return '';

  return `<div class="card" id="thread"${highlight ? ' style="border-color:var(--orange)"' : ''}>
    <div class="kicker">${highlight ? 'New reply' : 'Discussion'}</div>
    ${msgs}
    ${nextStep ? `<p class="clause" style="margin-top:${t.length ? '12' : '6'}px">${nextStep}</p>` : ''}
    ${closed ? '' : `<p class="recordnote" style="margin-top:10px;text-align:left">If the
      price or the work needs to change, they send you a new version to approve.
      Agreeing to a number in this discussion does not change what you are signing
      above.</p>`}
    <p class="recordnote" style="margin-top:6px;text-align:left">This discussion is
      part of the project record.</p>
  </div>`;
}

/**
 * Pull one labelled section out of the FROZEN wording.
 *
 * WHY READ THE INSTRUMENT INSTEAD OF ADDING FIELDS (hadar, 2026-08-05: "the
 * recipient needs to be clear and upfront with the SOW, who is it from and what are
 * the terms -- but first the SOW"). This page received `scope_title` and a price and
 * nothing else: the actual scope text AND every flow term -- what is not included,
 * when payment is due, what it does to the schedule -- existed only inside the
 * collapsed "See the exact wording" box. A client could approve a priced change
 * order having never seen the exclusions.
 *
 * Adding frozen columns for each would work and would also create a second copy of
 * contractual text that can disagree with the instrument. Reading the sections OUT
 * of shown_content cannot drift by construction: what is rendered IS what is signed
 * and hashed (240_shown_content_integrity).
 *
 * Returns null for anything sent before the sections existed, and every caller falls
 * back to the previous layout rather than showing an empty heading.
 *
 * ── THE ESCAPE BUG THIS FUNCTION SHIPPED WITH, recorded because the failure was
 *    SILENT and the fallback hid it ──────────────────────────────────────────────
 * The character class was written `'[\s\S]'` inside an ordinary JavaScript string.
 * `\s` is not a recognised string escape, so the literal collapses to the two
 * characters `s` and `S` and the regex compiled as `([sS]*?)` — a class matching only
 * the letter s. It therefore matched NOTHING for every real document, `docSection`
 * returned null on both calls, and `renderPriced`'s two fallbacks quietly took over:
 * no SCOPE OF WORK block and no TERMS block on the page.
 *
 * The effect was the exact defect this function was written on 2026-08-05 to fix
 * (hadar: "the recipient needs to be clear and upfront with the SOW … but first the
 * SOW"). A client could approve a priced change order having seen a title, a number,
 * and nothing about what is excluded, when payment is due, or what it does to the
 * schedule — all of which were sitting inside the collapsed raw wording, which is
 * where they were before the fix. Nothing threw, nothing logged, and the page looked
 * deliberate. Verified by running the old expression against a real `shown_content`.
 *
 * `[\\s\\S]` is the correct escaping in a string literal. It is written that way
 * rather than as a regex literal because `heading` is interpolated.
 */
function docSection(txt, heading) {
  if (!txt) return null;
  var re = new RegExp('(?:^|\n)' + heading + '\n([\\s\\S]*?)(?=\n\n[A-Z][A-Z &]{2,}\n|\n\nNothing proceeds|$)');
  var m = txt.match(re);
  return m && m[1].trim() ? m[1].trim() : null;
}

/**
 * The one-line "we did the thing you just tapped" banner.
 *
 * Its own function because all three document renderers need it and the EWA renderer
 * lives in another file. Green, at the top, above the fold: the client has just come
 * back from a screen that took over the whole page, and without an acknowledgement
 * the return reads as the tap having been ignored.
 */
function noticeHtml(text) {
  if (!text) return '';
  return `<div class="wrap"><div class="notice">${esc(text)}</div></div>`;
}

function renderPriced(d, notice) {
  const company = d.company_name || 'Your contractor';
  const priced = usd(d.amount_cents);
  const priorApproved = (d.approved_running_cents != null && d.approved_running_cents > 0)
    ? `<div class="trow"><span>Extras you've approved on this job</span><span class="money">${esc(usd(d.approved_running_cents))}</span></div>` : '';
  // PRD R3: a not-to-exceed is a cap PLUS a mandatory clause, and it is a different
  // instrument from a fixed price. Calling it "Fixed price" (as this page did
  // unconditionally) misrepresents what the client is signing, and "Not to exceed $X."
  // alone omits the term that stops the cap being read as the final number.
  const isNte = d.nte_cents != null;
  const nte = isNte
    ? `<div class="clause"><b>Not to exceed ${esc(usd(d.nte_cents))}.</b>
         Work will not exceed ${esc(usd(d.nte_cents))} without a new approval.</div>` : '';

  // Read straight out of the instrument. Null on anything sent before the sections
  // existed, and each falls back to the previous layout rather than an empty heading.
  const sow = docSection(d.shown_content, 'SCOPE OF WORK');
  const termsBlock = docSection(d.shown_content, 'TERMS');
  // Everything under TERMS except the price lines, which the page already renders
  // large above -- repeating them as small grey rows would read as a second, quieter
  // number beside the one being agreed to.
  const termLines = (termsBlock || '').split('\n')
    .map((l) => l.trim())
    .filter((l) => l && !/^Price:/.test(l) && !/^Not to exceed:/.test(l)
                    && !/^Work will not exceed /.test(l));

  screen(`
    <div class="brand">
      <div class="logo">${esc(initials(company))}</div>
      <div>
        <div class="cn">${esc(company)}</div>
        <div class="cs">${esc(d.job_label || '')}</div>
      </div>
    </div>
    ${noticeHtml(notice)}
    <div class="wrap">
      <!-- THE SCOPE FIRST, AND IN FULL. This card carried a title and a generic
           sentence about extras; the work itself was only inside the collapsed exact
           wording. A price means nothing until you know what it buys, so the scope
           leads and the money follows it. -->
      <div class="card">
        <div class="kicker">Approval requested</div>
        <div class="title">${esc(d.scope_title || 'Extra work')}</div>
        ${sow ? `<div class="sow">${esc(sow)}</div>` : ''}
        <div class="scope">This is an extra, outside the original scope. Please review it and approve before the work goes ahead.</div>
        <div class="fromline">From <b>${esc(company)}</b>${d.job_label ? ` &middot; ${esc(d.job_label)}` : ''}</div>
      </div>

      <div class="card">
        <div class="price"><span class="pl">${isNte ? 'Time &amp; materials' : 'Fixed price'}</span><span class="pv">${esc(priced)}</span></div>
        <div class="clause">This work is outside the contracted scope and is billed as an extra. Nothing proceeds until you approve.</div>
        ${nte}
        <!-- THE TERMS, ON THE PAGE. Exclusions, payment timing and schedule impact are
             contractual and were previously visible only to a client who thought to
             expand the raw wording. Rendered FROM the frozen text, so they cannot
             disagree with what is signed. -->
        ${termLines.length
          ? `<div class="terms">${termLines.map((l) => `<div class="tline">${esc(l)}</div>`).join('')}</div>`
          : ''}
        <div class="totals">
          <div class="trow"><span>This request</span><b>${esc(priced)}${isNte ? ` <span style="font-weight:400">(max ${esc(usd(d.nte_cents))})</span>` : ''}</b></div>
          ${priorApproved}
        </div>
        <details class="exact">
          <summary>See the exact wording</summary>
          <div class="doc">${esc(d.shown_content)}</div>
        </details>
      </div>

      ${photoStrip(d.photos)}

      ${threadHtml(d)}
      <input class="sign" id="name" placeholder="Type your full name to sign" autocomplete="name">
      <button class="approve" id="approve" disabled>✓ Approve${isNte ? ` — up to ${esc(usd(d.nte_cents))}` : ` — ${esc(priced)}`}</button>
      <button class="ghost" id="ask">Ask a question instead</button>
      <button class="ghost" id="decline">Decline — do not proceed</button>
      <p class="recordnote">Your response, your name, and the date &amp; time become part of the project record. No account needed.</p>
    </div>`);

  const nameEl = document.getElementById('name');
  const approveEl = document.getElementById('approve');
  nameEl.addEventListener('input', () => { approveEl.disabled = nameEl.value.trim().length < 2; });
  approveEl.onclick = () => answer('confirmed', null, nameEl.value.trim());
  // Three distinct outcomes (PRD R5). Asking is not declining.
  document.getElementById('ask').onclick = () => askQuestion(d);
  document.getElementById('decline').onclick = () => declineFlow(d);
}

// ASK A QUESTION — not a decline.
//
// This used to call answer('declined', …), which permanently declined the item and
// burned the single-use token, so a client who asked a question could never approve
// afterwards. It also made the decline status meaningless, because "I have a
// question" and "do not proceed" wrote the same row. A question is now a message on
// its own thread: it commits nobody, needs no signature, and leaves Approve live —
// PRD R5b, "the Approve button remains pinned at every point in the thread".
//
// ── ASKING IS NO LONGER A DEAD END ─────────────────────────────────────────────
// A successful ask used to end on `done('💬', 'Question sent', …)`: a terminal
// screen, with no way back to the document and no way to ask a second thing. The
// product ask this page serves is "where they can approve, communicate, negotiate",
// and negotiating is by definition more than one message. Every path off that screen
// was outside the app — find the text again, tap the link again, read the whole
// document again — and each of those is a place a non-technical homeowner stops.
//
// So a sent question returns to the DOCUMENT, with the thread refetched so their own
// words are on the page (proof it landed, which is what the terminal screen was
// really for) and with Approve, Decline and Ask all live again. The banner carries
// the acknowledgement the old screen carried.
function askQuestion(d) {
  screen(`
    <div class="wrap" style="padding-top:24px">
      <h1 class="plain">What's your question?</h1>
      <textarea id="note" placeholder="What would you like to ask or change?"></textarea>
      <div class="btns">
        <button class="yes" id="send">Send to ${esc(d.company_name || 'the contractor')}</button>
        <button class="ghost" id="back">Back</button>
      </div>
      <p class="recordnote">Asking does not approve or decline anything. You can still
        approve after they answer. If you are asking for a different price, they will
        send you a new version to approve — this one stays as it is until then.</p>
    </div>`);
  document.getElementById('send').onclick = async () => {
    const note = document.getElementById('note').value.trim();
    if (!note) return;
    document.querySelectorAll('button').forEach((b) => (b.disabled = true));
    const { data, error } = await supabase.rpc('confirmation_ask', {
      p_token: token, p_note: note, p_user_agent: navigator.userAgent,
    });
    if (error) {
      // A question can be refused for one reason that is NOT a network problem: the
      // link was retired while this screen was open (250 + confirmation_question_
      // not_superseded). Saying "that didn't send, tap again" there would send them
      // round a loop that can never succeed, on a document that no longer exists.
      // Named, for the same reason `answer()` names it.
      if ((error.message || '').includes('replaced by a newer one') ||
          error.hint === 'link_superseded') {
        screen(`<div class="done"><div class="mark err">🔄</div>
          <h2>This version was replaced</h2>
          <p>The contractor sent an updated version while this page was open. Your
             question was not sent. Please open the most recent link they texted
             you.</p></div>`);
        return;
      }
      screen(`<div class="done"><div class="mark err">⚠️</div>
        <h2>That didn't send</h2><p>Nothing was recorded. Please tap again.</p>
        <div class="btns"><button class="yes" onclick="location.reload()">Try again</button></div></div>`);
      return;
    }
    if (data && data.status === 'already_answered') {
      done('✅', 'Already answered', 'Your first answer stands.'); return;
    }
    // Refetch rather than appending the local string: the server stamps the time and
    // trims the note, and the thread walks the revision lineage. Rendering our own
    // copy would put a message on screen that differs from the record. If the refetch
    // fails, `loadThread` keeps the previous thread and the banner still tells the
    // truth — the question is recorded either way.
    await loadThread(d);
    renderDocument(d, 'Sent. They have your question — you can still approve or decline below.');
  };
  document.getElementById('back').onclick = () => renderDocument(d);
}

// DECLINE — a real, terminal, signed answer. It stops work and the contractor acts
// on it, so it carries the same signature an approval does: unsigned, anyone holding
// the link could halt a job. The reason stays optional; demanding an explanation to
// say no is how you get no answer at all.
function declineFlow(d) {
  screen(`
    <div class="wrap" style="padding-top:24px">
      <h1 class="plain">Decline this?</h1>
      <p class="recordnote" style="margin:0 0 10px">This tells ${esc(d.company_name || 'the contractor')}
        not to proceed. It is final and becomes part of the project record.</p>
      <textarea id="note" placeholder="Optional — why?"></textarea>
      <input class="sign" id="dname" placeholder="Type your full name to sign" autocomplete="name">
      <div class="btns">
        <button class="decline" id="send" disabled>Decline — do not proceed</button>
        <button class="ghost" id="back">Back</button>
      </div>
    </div>`);
  const dn = document.getElementById('dname');
  const sendEl = document.getElementById('send');
  dn.addEventListener('input', () => { sendEl.disabled = dn.value.trim().length < 2; });
  sendEl.onclick = () =>
    answer('declined', document.getElementById('note').value, dn.value.trim());
  // Back goes through the ONE dispatch. This line used to re-decide the document type
  // from `amount_cents`, which is null for an EWA as well as for a legacy confirm — so
  // backing out of a decline on an authorization redrew it as a plain confirmation
  // with its proceed term and settlement window gone, still offering a signature.
  document.getElementById('back').onclick = () => renderDocument(d);
}

// Legacy no-price confirmation (a decision, no cost change). Kept working.
function renderPlain(d, notice) {
  const verb = d.kind === 'confirm' ? 'confirm' : 'acknowledge';
  screen(`
    ${noticeHtml(notice)}
    <div class="wrap" style="padding-top:24px">
      <div class="who">For ${esc(d.counterparty)}</div>
      <h1 class="plain">Please read this and ${verb} it.</h1>
      <div class="plaincard">${esc(d.shown_content)}</div>
      ${/* An EWA (PRD R3 step 1) is "condition description + photos" and carries no
            price, so it renders through here. Leaving the strip off this path would
            drop the photos from the one instrument whose entire content IS the
            condition being photographed. */ ''}
      ${photoStrip(d.photos)}
      ${/* The discussion was MISSING from this renderer entirely, while the "Ask a
            question instead" button below has always been offered here. So a client
            on a plain confirmation could ask, and then never see their own question,
            never see the answer, and have no evidence either had happened. The same
            hole as DEF-5, on the third of the three documents. */''}
      ${threadHtml(d)}
      <input class="sign" id="name" placeholder="Type your full name to sign" autocomplete="name">
      <div class="btns">
        <button class="yes" id="yes" disabled>Yes — that's right</button>
        <button class="no" id="no">No — that's not right</button>
        <button class="ghost" id="askp">Ask a question instead</button>
      </div>
      <p class="recordnote">Your answer, your name, and the date &amp; time become part of the project record. No account needed.</p>
    </div>`);
  // A Decision is signed like any other item (PRD R10). It carries no money, but a
  // confirmed spec — "the vanity is 34 inches" — is exactly what a rework argument
  // turns on months later, so it is worth the same signature as a priced extra.
  //
  // Saying NO is signed too. This line used to read "Saying NO still needs no name:
  // identity is not the price of declining" — true once, and left behind when declines
  // became signed (declineFlow below, enforced by 210_approval_signature.sql). It
  // described a path that no longer exists, in the one file where a maintainer might
  // believe it and take the signature back off a decline.
  const plainName = document.getElementById('name');
  const yesEl = document.getElementById('yes');
  plainName.addEventListener('input', () => { yesEl.disabled = plainName.value.trim().length < 2; });
  yesEl.onclick = () => answer('confirmed', null, plainName.value.trim());
  // "No" is a real decline (signed, terminal). Asking is its own, unsigned path.
  document.getElementById('no').onclick = () => declineFlow(d);
  document.getElementById('askp').onclick = () => askQuestion(d);
}

async function answer(action, note, name) {
  document.querySelectorAll('button').forEach((b) => (b.disabled = true));
  // Stop the reply poller BEFORE the round trip, not after it. Every branch below
  // replaces the whole screen, so from here on there is no `#thread` element for the
  // poller to update; and on the success path the document is terminal, where R5b
  // closes the thread and nothing further can arrive. A poll that fired in between
  // would be a request made on behalf of a page that no longer exists.
  window.dispatchEvent(new Event('ezjb:answered'));
  const { data, error } = await supabase.rpc('confirmation_respond', {
    p_token: token, p_action: action, p_note: note || null,
    p_user_agent: navigator.userAgent,   // an identity SIGNAL, not proof.
    p_signed_name: name || null,
  });

  if (error) {
    // The database refuses an unsigned priced approval (210_approval_signature.sql).
    // A normal reader cannot reach this — the button stays disabled until a name is
    // typed — so this is a direct RPC call or a broken client. Say what is missing
    // rather than "that didn't send", which would be the wrong reason.
    // Retired between opening the page and tapping. Rare, but it is exactly the
    // race the supersede rule exists to catch, so name it.
    if ((error.message || '').includes('replaced by a newer one') ||
        error.hint === 'link_superseded') {
      screen(`<div class="done"><div class="mark err">🔄</div>
        <h2>This version was replaced</h2>
        <p>The contractor sent an updated version while this page was open.
           Nothing was recorded. Please open the most recent link they texted you.</p></div>`);
      return;
    }
    const needsSignature =
      (error.message || '').includes('requires a typed signature') ||
      error.hint === 'signature_required';
    if (needsSignature) {
      screen(`<div class="done"><div class="mark err">✋</div>
        <h2>A name is required</h2>
        <p>Saying yes is a signature, so it has to be signed.
           Nothing was recorded. Open the link again and type your full name.</p>
        <div class="btns"><button class="yes" onclick="location.reload()">Open it again</button></div></div>`);
      return;
    }
    screen(`<div class="done"><div class="mark err">⚠️</div>
      <h2>That didn't send</h2>
      <p>Nothing was recorded. Please tap again.</p>
      <div class="btns"><button class="yes" onclick="location.reload()">Try again</button></div></div>`);
    return;
  }
  if (data.status === 'already_answered') { done('✅', 'Already answered', 'Your first answer stands.'); return; }
  done(action === 'confirmed' ? '✅' : '✋',
    action === 'confirmed' ? (name ? `Approved — signed ${name}` : 'Thank you — confirmed') : 'Thank you — sent',
    'The contractor has your answer. You can close this page.');
}

// NOTHING MAY LEAVE THIS PAGE ON "Loading…" FOREVER.
//
// `load()` used to be called bare. It is an async function, so anything it threw
// became an unhandled rejection: no screen, no console error, and a client left
// staring at a spinner with no way to tell whether the link was broken, the signal
// was bad, or they had done something wrong. That is exactly how the `.catch`
// outage above stayed invisible — the failure had a message and nowhere to put it.
//
// The recovery screen says the only two things a homeowner can act on: try again,
// or ask for the link again. It deliberately does NOT show the exception. A stack
// trace tells this reader nothing and looks like the app broke on them.
load().catch((e) => {
  // Kept for whoever is looking at a device with a console attached. It is the only
  // place the real reason survives.
  console.error('[confirm] load failed', e);
  screen(`<div class="done"><div class="mark err">⚠️</div>
    <h2>This didn't load</h2>
    <p>Something went wrong opening this. Nothing here was recorded.</p>
    <div class="btns"><button class="yes" onclick="location.reload()">Try again</button></div>
    <p class="recordnote">If it keeps happening, ask your contractor to text you the
      link again.</p></div>`);
});
</script>
</body>
</html>
